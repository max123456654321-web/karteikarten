<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Karteikarten</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f2" id="theme-color-meta">

<!-- Design (hell/dunkel) SOFORT setzen, noch bevor etwas gezeichnet wird —
     sonst blitzt beim Start kurz die helle Oberfläche auf. -->
<script>
(function () {
  try {
    var pref = localStorage.getItem('karteikarten-theme') || 'auto';
    var dark = pref === 'dark' ||
      (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* localStorage gesperrt: bleibt hell */ }
})();
</script>

<!-- MathJax: Formeln in \( \), \[ \] und $$ $$ erkennen -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']]
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

<!-- JSZip zum Entpacken der .apkg-Datei -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- sql.js zum Lesen der SQLite-Datenbank (WebAssembly) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

<style>
  :root {
    --bg-a: #fbf7f0;
    --bg-b: #f3ece1;
    --card-bg: #ffffff;
    --ink: #2c2a26;
    --ink-soft: #7a7264;
    --accent: #b08d5a;
    --accent-soft: #e8dcc4;
    --accent-dark: #6b5a3a;
    --line: #ece3d3;
    --again: #d1685a;
    --hard: #dba24a;
    --good: #5fa377;
    --easy: #5089b3;
    --radius: 20px;
    --shadow-sm: 0 1px 2px rgba(107, 90, 58, .08), 0 1px 1px rgba(107, 90, 58, .04);
    --shadow-md: 0 8px 24px rgba(107, 90, 58, .12), 0 2px 6px rgba(107, 90, 58, .08);
    --shadow-lg: 0 16px 40px rgba(107, 90, 58, .16), 0 4px 12px rgba(107, 90, 58, .1);
  }

  /* ---------- Dark Mode ----------
     Umschaltbar über die Einstellungen (⚙️ auf der Startseite): Automatisch,
     Hell oder Dunkel. Gesetzt wird data-theme="dark" am <html>-Element; das
     Layout bleibt exakt gleich, nur die Farben ändern sich.
     Karteninhalte aus Anki bringen oft eigene Farben mit (Notiztyp-CSS und
     Inline-Styles) — die werden zusätzlich in JS lesbar gemacht, siehe
     stripColorDeclarations() und adaptCardForDark(). */
  html[data-theme="dark"] {
    --bg-a: #1a1815;
    --bg-b: #121110;
    --card-bg: #24211b;
    --ink: #ece6da;
    --ink-soft: #a29886;
    --accent: #cba875;
    --accent-soft: #3b3325;
    --accent-dark: #e7cd9a;
    --line: #37312a;
    --again: #e0796a;
    --hard: #e0ac5c;
    --good: #6bb388;
    --easy: #6098c4;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, .55);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6);
  }
  /* Stellen, an denen im hellen Design fest weiße/helle Werte stehen */
  html[data-theme="dark"] header.topbar .back-btn,
  html[data-theme="dark"] .icon-btn { background: rgba(255,255,255,.07); color: var(--ink); }
  html[data-theme="dark"] header.topbar .back-btn { color: var(--accent-dark); }
  html[data-theme="dark"] header.topbar .back-btn:active,
  html[data-theme="dark"] .icon-btn:active { background: rgba(255,255,255,.15); }
  html[data-theme="dark"] .import-zone { background: rgba(255,255,255,.03); }
  html[data-theme="dark"] .import-zone.dragover { background: rgba(255,255,255,.08); }
  html[data-theme="dark"] button.primary {
    background: linear-gradient(135deg, #d9b87a, #b08d5a); color: #231f17;
  }
  html[data-theme="dark"] button.secondary:active { background: #453d32; }
  html[data-theme="dark"] .deck-card .deck-icon { background: linear-gradient(135deg, #3b3325, #2c2820); }
  html[data-theme="dark"] .progress-bar-track { background: rgba(255,255,255,.08); }
  html[data-theme="dark"] .card-fav-btn,
  html[data-theme="dark"] .card-del-btn { background: rgba(255,255,255,.11); color: var(--ink); }
  html[data-theme="dark"] .mode-btn { background: rgba(255,255,255,.07); color: var(--ink); }
  html[data-theme="dark"] .mode-btn.active { background: var(--accent-soft); }
  html[data-theme="dark"] .card-row:active { background: rgba(255,255,255,.05); }
  html[data-theme="dark"] .modal-overlay { background: rgba(0,0,0,.62); }
  html[data-theme="dark"] .modal-box { background: var(--card-bg); }
  html[data-theme="dark"] .toast { background: #3a332a; color: var(--ink); }
  /* Schwarze "Später"-Elemente brauchen auf dunklem Grund eine Kante */
  html[data-theme="dark"] .card-defer-badge,
  html[data-theme="dark"] .tile-defer-badge,
  html[data-theme="dark"] .row-defer-badge,
  html[data-theme="dark"] .browse-undefer-btn,
  html[data-theme="dark"] .undefer-all-btn { background: #101010; border: 1px solid rgba(255,255,255,.32); }
  html[data-theme="dark"] .answer-buttons .btn-defer { background: linear-gradient(135deg, #6e6e6e, #3a3a3a); }
  /* Anki-Bilder sind häufig freigestellte PNGs mit schwarzen Linien — auf
     dunklem Grund wären sie unsichtbar. Deshalb weiße Unterlage. */
  html[data-theme="dark"] .anki-card-scope img,
  html[data-theme="dark"] .flashcard img { background: #fff; padding: 4px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  header.topbar {
    padding: 24px 24px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h1 {
    font-size: 1.6rem; margin: 0; font-weight: 800; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px;
  }
  header.topbar h1 .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--good));
    display: inline-block;
  }
  header.topbar .back-btn {
    background: rgba(255,255,255,.6); border: none; font-size: .95rem; color: var(--accent-dark);
    padding: 10px 16px; cursor: pointer; font-weight: 600; border-radius: 12px;
    transition: background .15s, transform .1s;
  }
  header.topbar .back-btn:active { background: rgba(255,255,255,.9); transform: scale(.97); }
  .icon-btn {
    background: rgba(255,255,255,.6); border: none; border-radius: 12px;
    padding: 9px 12px; font-size: 1.15rem; line-height: 1; cursor: pointer;
    transition: background .15s, transform .1s;
    -webkit-appearance: none; appearance: none; /* iOS: sonst native Button-Darstellung */
  }
  .icon-btn:active { background: rgba(255,255,255,.9); transform: scale(.94); }

  main { flex: 1; padding: 0 20px 40px; max-width: 720px; margin: 0 auto; width: 100%; }

  /* ---------- Startseite ---------- */
  .import-zone {
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 28px;
    background: rgba(255,255,255,.35);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .import-zone .import-icon { font-size: 2rem; margin-bottom: 6px; }
  .import-zone.dragover { background: rgba(255,255,255,.7); border-color: var(--accent-dark); transform: scale(1.01); }
  .import-zone button.primary { margin-top: 14px; }

  button {
    font-family: inherit; font-size: 1rem; border-radius: 14px; border: none;
    cursor: pointer; padding: 14px 20px; touch-action: manipulation;
    transition: transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent-dark), #4a3e28);
    color: #fff; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  button.primary:active { transform: scale(.97); box-shadow: none; }
  button.secondary { background: var(--line); color: var(--ink); }
  button.secondary:active { background: #ddd2b8; transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }

  .deck-list { display: flex; flex-direction: column; gap: 14px; }
  .deck-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 14px;
    transition: box-shadow .2s, transform .2s;
  }
  .deck-card:hover { box-shadow: var(--shadow-md); }
  .deck-card .deck-icon {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-soft), #f6efdd);
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
  }
  .deck-card .deck-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .deck-card .deck-info { flex: 1; min-width: 0; }
  .deck-card .deck-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; overflow-wrap: break-word; }
  .deck-card .deck-meta { color: var(--ink-soft); font-size: .88rem; }
  .deck-card .deck-meta .due-badge {
    display: inline-block; background: var(--accent-soft); color: var(--accent-dark);
    border-radius: 20px; padding: 2px 10px; font-weight: 700; font-size: .8rem; margin-right: 6px;
  }
  .deck-stats { margin-top: 8px; }
  .stat-bar-track {
    background: var(--line); height: 5px; border-radius: 4px; overflow: hidden;
  }
  .stat-bar-fill {
    background: linear-gradient(90deg, var(--accent), var(--good));
    height: 100%; transition: width .3s ease;
  }
  .deck-stats-text { color: var(--ink-soft); font-size: .78rem; margin-top: 5px; }
  .deck-card .deck-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .deck-card .delete-btn {
    background: none; color: var(--again); font-size: .85rem; padding: 10px; margin-left: auto;
  }
  .empty-hint { color: var(--ink-soft); text-align: center; padding: 48px 20px; font-size: 1rem; }
  .empty-hint .empty-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }

  /* ---------- Lern-Ansicht ---------- */
  .progress-wrap { padding: 4px 0 20px; }
  .progress-bar-track {
    background: rgba(255,255,255,.6); height: 8px; border-radius: 6px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--accent), var(--good));
    height: 100%; width: 0%; transition: width .3s ease;
  }
  .progress-count { text-align: center; color: var(--ink-soft); font-size: .88rem; margin-top: 8px; font-weight: 600; }

  .card-area {
    display: flex; align-items: center; justify-content: center;
    min-height: 48vh; perspective: 1200px; position: relative;
  }
  .card-fav-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.85); border: none; box-shadow: var(--shadow-sm);
    font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .card-fav-btn:active { transform: scale(.92); }
  /* Papierkorb-Knopf oben links auf der Lernkarte (löscht die aktuelle Karte) */
  .card-del-btn {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.85); border: none; box-shadow: var(--shadow-sm);
    font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .card-del-btn:active { transform: scale(.92); }
  /* Schwarze "Später"-Markierung oben links (zurückgestellte Karten) — rein visuell */
  .card-defer-badge {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: #1c1c1c; color: #fff; font-size: .72rem; font-weight: 700;
    padding: 5px 11px; border-radius: 12px; box-shadow: var(--shadow-sm);
    letter-spacing: .02em;
  }
  /* Deutlicher Knopf zum Aufheben der Zurückstellung (Einzelansicht) */
  .browse-undefer-btn {
    background: #1c1c1c; color: #fff; font-weight: 700; font-size: .92rem;
    padding: 13px 16px; border-radius: 12px; margin-top: 12px; width: 100%;
    -webkit-appearance: none; appearance: none; border: none;
  }
  .browse-undefer-btn:active { transform: scale(.98); background: #000; }
  .flashcard {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    width: 100%; min-height: 300px; padding: 36px 26px;
    display: flex; flex-direction: column; justify-content: center;
    touch-action: manipulation; user-select: none;
    font-size: 1.25rem; line-height: 1.55; text-align: center;
    cursor: pointer;
    animation: card-in .25s ease;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .flashcard .side-label {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); margin-bottom: 14px; font-weight: 700;
  }
  .flashcard img { max-width: 100%; height: auto; border-radius: 10px; }
  .cloze-answer { color: var(--good); font-weight: 700; }
  .anki-card-scope { display: block; }

  .mc-question { font-weight: 700; margin-bottom: 18px; }
  .mc-options { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .mc-option {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-a); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px; font-size: .95rem;
  }
  .mc-badge {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .mc-option.mc-correct { background: rgba(95,163,119,.15); border-color: var(--good); }
  .mc-option.mc-correct .mc-badge { background: var(--good); color: #fff; }
  .mc-correct-box {
    margin-top: 18px; background: rgba(95,163,119,.15); color: var(--accent-dark);
    border-radius: 14px; padding: 12px 16px; font-weight: 600; text-align: left;
  }
  .mc-explanation { margin-top: 14px; color: var(--ink-soft); font-size: .95rem; text-align: left; }
  #card-back-wrap { animation: reveal-in .3s ease; }
  @keyframes reveal-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .tap-hint { text-align: center; color: var(--ink-soft); font-size: .85rem; margin-top: 16px; }

  .answer-buttons {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-top: 20px;
  }
  .answer-buttons.answer-buttons-5 { grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .answer-buttons button {
    padding: 16px 6px; font-weight: 700; color: #fff; font-size: .95rem;
    box-shadow: var(--shadow-sm);
  }
  .answer-buttons.answer-buttons-5 button { padding: 14px 4px; font-size: .85rem; }
  .answer-buttons button:active { transform: scale(.96); }
  .answer-buttons .btn-defer { background: linear-gradient(135deg, #4a4a4a, #1c1c1c); }
  .answer-buttons .btn-again { background: linear-gradient(135deg, var(--again), #b8523f); }
  .answer-buttons .btn-hard { background: linear-gradient(135deg, var(--hard), #c98a2e); }
  .answer-buttons .btn-good { background: linear-gradient(135deg, var(--good), #468a63); }
  .answer-buttons .btn-easy { background: linear-gradient(135deg, var(--easy), #3a749f); }
  .answer-buttons button .sub { display: block; font-size: .72rem; font-weight: 400; opacity: .85; margin-top: 2px; }
  .answer-buttons.answer-buttons-5 button .sub { font-size: .66rem; }

  .browse-nav { display: flex; gap: 10px; margin-top: 20px; }
  .browse-nav button { flex: 1; }
  .browse-delete-btn {
    background: none; color: var(--again); font-weight: 600; font-size: .9rem;
    padding: 11px 16px; border-radius: 12px; margin-top: 10px; width: 100%;
  }
  .browse-delete-btn:active { background: rgba(209,104,90,.12); }

  .browse-mode-switch { display: flex; gap: 4px; }
  .mode-btn { background: rgba(255,255,255,.6); border: none; border-radius: 10px; padding: 8px 10px; font-size: .95rem; cursor: pointer; }
  .mode-btn.active { background: var(--accent-soft); }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-top: 10px;
  }
  .card-tile {
    position: relative; background: var(--card-bg); border-radius: 14px;
    box-shadow: var(--shadow-sm); padding: 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    transition: box-shadow .15s, transform .1s;
  }
  .card-tile:active { transform: scale(.97); }
  .card-tile-img {
    width: 100%; height: 70px; border-radius: 10px; background-size: cover;
    background-position: center; background-color: var(--bg-a);
  }
  .card-tile-text {
    font-size: .82rem; line-height: 1.35; color: var(--ink);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }
  .tile-fav-btn {
    position: absolute; top: 6px; right: 6px; background: none; border: none;
    padding: 2px; font-size: 1rem; line-height: 1; cursor: pointer; z-index: 1;
    color: var(--ink); /* sonst Button-Schwarz -> leerer Stern im Dark Mode unsichtbar */
  }
  /* Schwarze "Später"-Markierung als Chip oben links in der Kachel — antippen zum Aufheben */
  .tile-defer-badge {
    align-self: flex-start; background: #1c1c1c; color: #fff;
    font-size: .6rem; font-weight: 700; line-height: 1;
    padding: 4px 7px; border-radius: 8px; letter-spacing: .02em; cursor: pointer;
  }
  .tile-defer-badge:active { transform: scale(.9); }

  .card-simplelist { display: flex; flex-direction: column; margin-top: 10px; }
  .card-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 6px; border-bottom: 1px solid var(--line);
    font-size: .85rem; cursor: pointer;
  }
  .card-row:active { background: rgba(255,255,255,.5); }
  .card-row-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .row-fav-btn {
    background: none; border: none; padding: 2px; font-size: 1rem; line-height: 1;
    cursor: pointer; flex-shrink: 0; color: var(--ink);
  }
  /* Schwarze "Später"-Markierung als Chip in der Listenzeile — antippen zum Aufheben */
  .row-defer-badge {
    flex-shrink: 0; background: #1c1c1c; color: #fff; font-size: .6rem;
    font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 8px; letter-spacing: .02em;
    cursor: pointer;
  }
  .row-defer-badge:active { transform: scale(.9); }
  .row-del-btn {
    background: none; border: none; padding: 4px 6px; font-size: 1rem; line-height: 1;
    cursor: pointer; flex-shrink: 0; color: var(--again); opacity: .65;
  }
  .row-del-btn:active { opacity: 1; }

  .session-summary {
    background: var(--card-bg); border-radius: var(--radius); padding: 40px 24px;
    text-align: center; box-shadow: var(--shadow-md);
    animation: card-in .3s ease;
  }
  .session-summary .emoji-big { font-size: 2.6rem; }
  .session-summary h2 { margin-top: 8px; }
  .session-summary .stat-row { display: flex; justify-content: center; gap: 32px; margin: 24px 0; }
  .session-summary .stat { display: flex; flex-direction: column; }
  .session-summary .stat .num { font-size: 2rem; font-weight: 800; color: var(--accent-dark); }
  .session-summary .stat .label { color: var(--ink-soft); font-size: .85rem; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(44,42,38,.45);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .modal-box {
    background: #fff; border-radius: var(--radius); padding: 26px; max-width: 400px; width: 100%;
    box-shadow: var(--shadow-lg);
    animation: card-in .2s ease;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-box .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }

  /* ---------- Einstellungen (Schalter) ---------- */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-text { min-width: 0; }
  .setting-label { font-weight: 700; }
  .setting-desc { color: var(--ink-soft); font-size: .82rem; margin-top: 3px; line-height: 1.35; }
  .switch {
    position: relative; flex-shrink: 0; width: 54px; height: 31px; padding: 0;
    background: var(--line); border: none; border-radius: 16px; cursor: pointer;
    transition: background .18s;
    /* iOS/iPad: ohne appearance:none überdeckt die native Button-Darstellung
       Hintergrund und Schieber (siehe Badge-Bug in einem früheren Update). */
    -webkit-appearance: none; appearance: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .18s;
  }
  .switch.on { background: var(--good); }
  .switch.on::after { transform: translateX(23px); }
  .switch:disabled { opacity: .4; cursor: default; }

  /* ---------- Werkzeugleiste in Kachel-/Listenansicht ---------- */
  .browse-toolbar { display: flex; justify-content: flex-end; margin: 6px 0 2px; }
  .undefer-all-btn {
    background: #1c1c1c; color: #fff; font-weight: 700; font-size: .85rem;
    padding: 11px 15px; border-radius: 12px; border: none;
    -webkit-appearance: none; appearance: none;
  }
  .undefer-all-btn:active { transform: scale(.97); background: #000; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--accent-dark); color: #fff; padding: 13px 22px; border-radius: 14px;
    font-size: .9rem; max-width: 90%; text-align: center; z-index: 60;
    box-shadow: var(--shadow-md);
    animation: toast-in .2s ease;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ---------- Zeichenfeld (Apple Pencil) ----------
     Erscheint nur bei Zeichenaufgaben (siehe detectDrawing) oder wenn der
     Stift-Knopf unten rechts gedrückt wurde. Die Zeichenfläche bleibt bewusst
     immer hell — auch im Dark Mode —, weil man auf hellem Grund zeichnet. */
  .draw-block { margin: 16px 0 6px; text-align: center; }
  .draw-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 8px;
  }
  .draw-toolbar .sep { width: 1px; height: 26px; background: var(--line); margin: 0 3px; }
  /* Mindestgröße 44x44 Punkt, damit die Knöpfe auf dem iPad mit dem Finger treffbar sind */
  .draw-btn {
    width: 44px; height: 44px; min-width: 44px; padding: 0; border: none; border-radius: 12px;
    background: rgba(255,255,255,.6); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  html[data-theme="dark"] .draw-btn { background: rgba(255,255,255,.08); color: var(--ink); }
  .draw-btn:active { transform: scale(.92); }
  .draw-btn:disabled { opacity: .3; }
  .draw-btn.active { box-shadow: inset 0 0 0 3px var(--accent); background: var(--accent-soft); }
  .draw-btn.eraser-on { background: var(--hard); color: #241c07; box-shadow: inset 0 0 0 3px var(--accent-dark); }
  .draw-btn.danger { color: var(--again); }
  .draw-color .dot {
    width: 22px; height: 22px; border-radius: 50%; display: block;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  .draw-size .dot { border-radius: 50%; background: currentColor; display: block; }

  .draw-stack {
    position: relative; margin: 0 auto;
    /* 4:3 und höchstens ~55 % der Bildschirmhöhe (55vh * 4/3 ≈ 73vh Breite) */
    width: min(100%, 73vh);
    aspect-ratio: 4 / 3;
    background: #fdfcf9; border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
  }
  html[data-theme="dark"] .draw-stack { background: #f7f5f0; border-color: #4a4237; }
  .draw-stack img.draw-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; pointer-events: none;
    /* Die Dark-Mode-Regel für Kartenbilder (weiße Unterlage) darf hier nicht greifen */
    background: none !important; padding: 0 !important; border-radius: 0; max-width: none;
  }
  .draw-template { z-index: 1; }
  .draw-prev { z-index: 2; opacity: .3; display: none; }
  .draw-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3;
    touch-action: none;   /* sonst scrollt/zoomt iPadOS beim Zeichnen */
  }
  .draw-solution { z-index: 4; opacity: .5; display: none; }
  /* Bild, das als Hintergrundvorlage ins Canvas gewandert ist, im Text ausblenden */
  img[data-draw-template] { display: none !important; }

  .draw-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .draw-actions button { padding: 13px 16px; font-size: .9rem; font-weight: 600; }
  .draw-solve-btn { background: linear-gradient(135deg, var(--good), #468a63); color: #fff; box-shadow: var(--shadow-sm); }
  .draw-mini-btn { background: var(--line); color: var(--ink); }
  html[data-theme="dark"] .draw-mini-btn { background: rgba(255,255,255,.09); }
  .draw-overlay-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 10px; flex-wrap: wrap;
  }
  .draw-overlay-row input[type=range] { width: 150px; accent-color: var(--accent); }
  .draw-hint { color: var(--ink-soft); font-size: .76rem; margin-top: 8px; line-height: 1.4; }
  #draw-persist:not(:empty) { margin: 2px 0 14px; }
  .draw-pen-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 45;
    width: 54px; height: 54px; border-radius: 50%; padding: 0; border: none;
    background: var(--card-bg); color: var(--ink); box-shadow: var(--shadow-md);
    font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; appearance: none;
  }
  .draw-pen-fab:active { transform: scale(.93); }
  .draw-pen-fab.active { background: var(--accent-soft); box-shadow: var(--shadow-md), inset 0 0 0 3px var(--accent); }

  #file-input { display: none; }

  @media (min-width: 600px) {
    .flashcard { font-size: 1.4rem; }
  }
</style>
