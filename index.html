<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Karteikarten</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f5f2" id="theme-color-meta">

<!-- Design (hell/dunkel) SOFORT setzen, noch bevor etwas gezeichnet wird —
     sonst blitzt beim Start kurz die helle Oberfläche auf. -->
<script>
(function () {
  try {
    var pref = localStorage.getItem('karteikarten-theme') || 'auto';
    var dark = pref === 'dark' ||
      (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* localStorage gesperrt: bleibt hell */ }
})();
</script>

<!-- MathJax: Formeln in \( \), \[ \] und $$ $$ erkennen -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']]
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

<!-- JSZip zum Entpacken der .apkg-Datei -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- sql.js zum Lesen der SQLite-Datenbank (WebAssembly) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

<style>
  :root {
    --bg-a: #fbf7f0;
    --bg-b: #f3ece1;
    --card-bg: #ffffff;
    --ink: #2c2a26;
    --ink-soft: #7a7264;
    --accent: #b08d5a;
    --accent-soft: #e8dcc4;
    --accent-dark: #6b5a3a;
    --line: #ece3d3;
    --again: #d1685a;
    --hard: #dba24a;
    --good: #5fa377;
    --easy: #5089b3;
    --radius: 20px;
    --shadow-sm: 0 1px 2px rgba(107, 90, 58, .08), 0 1px 1px rgba(107, 90, 58, .04);
    --shadow-md: 0 8px 24px rgba(107, 90, 58, .12), 0 2px 6px rgba(107, 90, 58, .08);
    --shadow-lg: 0 16px 40px rgba(107, 90, 58, .16), 0 4px 12px rgba(107, 90, 58, .1);
  }

  /* ---------- Dark Mode ----------
     Umschaltbar über die Einstellungen (⚙️ auf der Startseite): Automatisch,
     Hell oder Dunkel. Gesetzt wird data-theme="dark" am <html>-Element; das
     Layout bleibt exakt gleich, nur die Farben ändern sich.
     Karteninhalte aus Anki bringen oft eigene Farben mit (Notiztyp-CSS und
     Inline-Styles) — die werden zusätzlich in JS lesbar gemacht, siehe
     stripColorDeclarations() und adaptCardForDark(). */
  html[data-theme="dark"] {
    --bg-a: #1a1815;
    --bg-b: #121110;
    --card-bg: #24211b;
    --ink: #ece6da;
    --ink-soft: #a29886;
    --accent: #cba875;
    --accent-soft: #3b3325;
    --accent-dark: #e7cd9a;
    --line: #37312a;
    --again: #e0796a;
    --hard: #e0ac5c;
    --good: #6bb388;
    --easy: #6098c4;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, .55);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6);
  }
  /* Stellen, an denen im hellen Design fest weiße/helle Werte stehen */
  html[data-theme="dark"] header.topbar .back-btn,
  html[data-theme="dark"] .icon-btn { background: rgba(255,255,255,.07); color: var(--ink); }
  html[data-theme="dark"] header.topbar .back-btn { color: var(--accent-dark); }
  html[data-theme="dark"] header.topbar .back-btn:active,
  html[data-theme="dark"] .icon-btn:active { background: rgba(255,255,255,.15); }
  html[data-theme="dark"] .import-zone { background: rgba(255,255,255,.03); }
  html[data-theme="dark"] .import-zone.dragover { background: rgba(255,255,255,.08); }
  html[data-theme="dark"] button.primary {
    background: linear-gradient(135deg, #d9b87a, #b08d5a); color: #231f17;
  }
  html[data-theme="dark"] button.secondary:active { background: #453d32; }
  html[data-theme="dark"] .deck-card .deck-icon { background: linear-gradient(135deg, #3b3325, #2c2820); }
  html[data-theme="dark"] .progress-bar-track { background: rgba(255,255,255,.08); }
  html[data-theme="dark"] .card-fav-btn,
  html[data-theme="dark"] .card-del-btn { background: rgba(255,255,255,.11); color: var(--ink); }
  html[data-theme="dark"] .mode-btn { background: rgba(255,255,255,.07); color: var(--ink); }
  html[data-theme="dark"] .mode-btn.active { background: var(--accent-soft); }
  html[data-theme="dark"] .card-row:active { background: rgba(255,255,255,.05); }
  html[data-theme="dark"] .modal-overlay { background: rgba(0,0,0,.62); }
  html[data-theme="dark"] .modal-box { background: var(--card-bg); }
  html[data-theme="dark"] .toast { background: #3a332a; color: var(--ink); }
  /* Schwarze "Später"-Elemente brauchen auf dunklem Grund eine Kante */
  html[data-theme="dark"] .card-defer-badge,
  html[data-theme="dark"] .tile-defer-badge,
  html[data-theme="dark"] .row-defer-badge,
  html[data-theme="dark"] .browse-undefer-btn,
  html[data-theme="dark"] .undefer-all-btn { background: #101010; border: 1px solid rgba(255,255,255,.32); }
  html[data-theme="dark"] .answer-buttons .btn-defer { background: linear-gradient(135deg, #6e6e6e, #3a3a3a); }
  /* Anki-Bilder sind häufig freigestellte PNGs mit schwarzen Linien — auf
     dunklem Grund wären sie unsichtbar. Deshalb weiße Unterlage. */
  html[data-theme="dark"] .anki-card-scope img,
  html[data-theme="dark"] .flashcard img { background: #fff; padding: 4px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Keine Textauswahl in der ganzen App. Auf dem iPad markierte der aufliegende
     Handballen beim Zeichnen sonst blau ganze Absätze (iOS hält das für einen
     Auswahl-Zieh-Vorgang), und die Lupe/das Kopieren-Menü ploppte auf.
     Herauskopiert wird aus dieser App nie etwas — nur Eingabefelder bleiben
     ausgenommen, sonst könnte man dort nicht mehr sinnvoll tippen. */
  html, body, #app {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  input, textarea, [contenteditable] {
    -webkit-user-select: text; user-select: text;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-a);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  /* Der Hintergrundverlauf liegt auf einer eigenen, fest positionierten Ebene
     statt als `background-attachment: fixed` auf dem body. Ein fixierter
     Hintergrund muss auf iOS bei JEDEM Scroll-Bild neu gezeichnet werden und
     ist dort eine der Hauptursachen für ruckeliges Scrollen; als eigene Ebene
     schiebt der Compositor ihn einfach mit. Sieht identisch aus. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
  }
  /* liegt über der Verlaufs-Ebene body::before */
  #app { min-height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

  header.topbar {
    padding: 24px 24px 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h1 {
    font-size: 1.6rem; margin: 0; font-weight: 800; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px;
  }
  header.topbar h1 .logo-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--good));
    display: inline-block;
  }
  header.topbar .back-btn {
    background: rgba(255,255,255,.6); border: none; font-size: .95rem; color: var(--accent-dark);
    padding: 10px 16px; cursor: pointer; font-weight: 600; border-radius: 12px;
    transition: background .15s, transform .1s;
  }
  header.topbar .back-btn:active { background: rgba(255,255,255,.9); transform: scale(.97); }
  .icon-btn {
    background: rgba(255,255,255,.6); border: none; border-radius: 12px;
    padding: 9px 12px; font-size: 1.15rem; line-height: 1; cursor: pointer;
    transition: background .15s, transform .1s;
    -webkit-appearance: none; appearance: none; /* iOS: sonst native Button-Darstellung */
  }
  .icon-btn:active { background: rgba(255,255,255,.9); transform: scale(.94); }

  main { flex: 1; padding: 0 20px 40px; max-width: 720px; margin: 0 auto; width: 100%; }

  /* ---------- Startseite ---------- */
  .import-zone {
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 28px;
    background: rgba(255,255,255,.35);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .import-zone .import-icon { font-size: 2rem; margin-bottom: 6px; }
  .import-zone.dragover { background: rgba(255,255,255,.7); border-color: var(--accent-dark); transform: scale(1.01); }
  .import-zone button.primary { margin-top: 14px; }

  button {
    font-family: inherit; font-size: 1rem; border-radius: 14px; border: none;
    cursor: pointer; padding: 14px 20px; touch-action: manipulation;
    transition: transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent-dark), #4a3e28);
    color: #fff; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  button.primary:active { transform: scale(.97); box-shadow: none; }
  button.secondary { background: var(--line); color: var(--ink); }
  button.secondary:active { background: #ddd2b8; transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }

  .deck-list { display: flex; flex-direction: column; gap: 14px; }
  .deck-card {
    background: var(--card-bg); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 14px;
    transition: box-shadow .2s, transform .2s;
  }
  .deck-card:hover { box-shadow: var(--shadow-md); }
  .deck-card .deck-icon {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-soft), #f6efdd);
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
  }
  .deck-card .deck-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .deck-card .deck-info { flex: 1; min-width: 0; }
  .deck-card .deck-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; overflow-wrap: break-word; }
  .deck-card .deck-meta { color: var(--ink-soft); font-size: .88rem; }
  .deck-card .deck-meta .due-badge {
    display: inline-block; background: var(--accent-soft); color: var(--accent-dark);
    border-radius: 20px; padding: 2px 10px; font-weight: 700; font-size: .8rem; margin-right: 6px;
  }
  .deck-stats { margin-top: 8px; }
  .stat-bar-track {
    background: var(--line); height: 5px; border-radius: 4px; overflow: hidden;
  }
  .stat-bar-fill {
    background: linear-gradient(90deg, var(--accent), var(--good));
    height: 100%; transition: width .3s ease;
  }
  .deck-stats-text { color: var(--ink-soft); font-size: .78rem; margin-top: 5px; }
  .deck-card .deck-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .deck-card .delete-btn {
    background: none; color: var(--again); font-size: .85rem; padding: 10px; margin-left: auto;
  }
  .empty-hint { color: var(--ink-soft); text-align: center; padding: 48px 20px; font-size: 1rem; }
  .empty-hint .empty-icon { font-size: 2.4rem; display: block; margin-bottom: 10px; }

  /* ---------- Lern-Ansicht ---------- */
  .progress-wrap { padding: 4px 0 20px; }
  .progress-bar-track {
    background: rgba(255,255,255,.6); height: 8px; border-radius: 6px; overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--accent), var(--good));
    height: 100%; width: 0%; transition: width .3s ease;
  }
  .progress-count { text-align: center; color: var(--ink-soft); font-size: .88rem; margin-top: 8px; font-weight: 600; }

  .card-area {
    display: flex; align-items: center; justify-content: center;
    min-height: 48vh; perspective: 1200px; position: relative;
  }
  .card-fav-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.85); border: none; box-shadow: var(--shadow-sm);
    font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .card-fav-btn:active { transform: scale(.92); }
  /* Papierkorb-Knopf oben links auf der Lernkarte (löscht die aktuelle Karte) */
  .card-del-btn {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    width: 42px; height: 42px; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.85); border: none; box-shadow: var(--shadow-sm);
    font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .card-del-btn:active { transform: scale(.92); }
  /* Schwarze "Später"-Markierung oben links (zurückgestellte Karten) — rein visuell */
  .card-defer-badge {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: #1c1c1c; color: #fff; font-size: .72rem; font-weight: 700;
    padding: 5px 11px; border-radius: 12px; box-shadow: var(--shadow-sm);
    letter-spacing: .02em;
  }
  /* Deutlicher Knopf zum Aufheben der Zurückstellung (Einzelansicht) */
  .browse-undefer-btn {
    background: #1c1c1c; color: #fff; font-weight: 700; font-size: .92rem;
    padding: 13px 16px; border-radius: 12px; margin-top: 12px; width: 100%;
    -webkit-appearance: none; appearance: none; border: none;
  }
  .browse-undefer-btn:active { transform: scale(.98); background: #000; }
  .flashcard {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    width: 100%; min-height: 300px; padding: 36px 26px;
    display: flex; flex-direction: column; justify-content: center;
    touch-action: manipulation; user-select: none;
    font-size: 1.25rem; line-height: 1.55; text-align: center;
    cursor: pointer;
    animation: card-in .25s ease;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .flashcard .side-label {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); margin-bottom: 14px; font-weight: 700;
  }
  .flashcard img { max-width: 100%; height: auto; border-radius: 10px; }
  .cloze-answer { color: var(--good); font-weight: 700; }
  .anki-card-scope { display: block; }

  .mc-question { font-weight: 700; margin-bottom: 18px; }
  .mc-options { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .mc-option {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-a); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px; font-size: .95rem;
  }
  .mc-badge {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .mc-option.mc-correct { background: rgba(95,163,119,.15); border-color: var(--good); }
  .mc-option.mc-correct .mc-badge { background: var(--good); color: #fff; }
  .mc-correct-box {
    margin-top: 18px; background: rgba(95,163,119,.15); color: var(--accent-dark);
    border-radius: 14px; padding: 12px 16px; font-weight: 600; text-align: left;
  }
  .mc-explanation { margin-top: 14px; color: var(--ink-soft); font-size: .95rem; text-align: left; }
  #card-back-wrap { animation: reveal-in .3s ease; }
  @keyframes reveal-in {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .tap-hint { text-align: center; color: var(--ink-soft); font-size: .85rem; margin-top: 16px; }

  .answer-buttons {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-top: 20px;
  }
  .answer-buttons.answer-buttons-5 { grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .answer-buttons button {
    padding: 16px 6px; font-weight: 700; color: #fff; font-size: .95rem;
    box-shadow: var(--shadow-sm);
  }
  .answer-buttons.answer-buttons-5 button { padding: 14px 4px; font-size: .85rem; }
  .answer-buttons button:active { transform: scale(.96); }
  .answer-buttons .btn-defer { background: linear-gradient(135deg, #4a4a4a, #1c1c1c); }
  .answer-buttons .btn-again { background: linear-gradient(135deg, var(--again), #b8523f); }
  .answer-buttons .btn-hard { background: linear-gradient(135deg, var(--hard), #c98a2e); }
  .answer-buttons .btn-good { background: linear-gradient(135deg, var(--good), #468a63); }
  .answer-buttons .btn-easy { background: linear-gradient(135deg, var(--easy), #3a749f); }
  .answer-buttons button .sub { display: block; font-size: .72rem; font-weight: 400; opacity: .85; margin-top: 2px; }
  .answer-buttons.answer-buttons-5 button .sub { font-size: .66rem; }

  .browse-nav { display: flex; gap: 10px; margin-top: 20px; }
  .browse-nav button { flex: 1; }
  .browse-delete-btn {
    background: none; color: var(--again); font-weight: 600; font-size: .9rem;
    padding: 11px 16px; border-radius: 12px; margin-top: 10px; width: 100%;
  }
  .browse-delete-btn:active { background: rgba(209,104,90,.12); }

  .browse-mode-switch { display: flex; gap: 4px; }
  .mode-btn { background: rgba(255,255,255,.6); border: none; border-radius: 10px; padding: 8px 10px; font-size: .95rem; cursor: pointer; }
  .mode-btn.active { background: var(--accent-soft); }

  .card-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-top: 10px;
  }
  .card-tile {
    position: relative; background: var(--card-bg); border-radius: 14px;
    box-shadow: var(--shadow-sm); padding: 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    transition: box-shadow .15s, transform .1s;
  }
  .card-tile:active { transform: scale(.97); }
  .card-tile-img {
    width: 100%; height: 70px; border-radius: 10px; background-size: cover;
    background-position: center; background-color: var(--bg-a);
  }
  .card-tile-text {
    font-size: .82rem; line-height: 1.35; color: var(--ink);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }
  .tile-fav-btn {
    position: absolute; top: 6px; right: 6px; background: none; border: none;
    padding: 2px; font-size: 1rem; line-height: 1; cursor: pointer; z-index: 1;
    color: var(--ink); /* sonst Button-Schwarz -> leerer Stern im Dark Mode unsichtbar */
  }
  /* Schwarze "Später"-Markierung als Chip oben links in der Kachel — antippen zum Aufheben */
  .tile-defer-badge {
    align-self: flex-start; background: #1c1c1c; color: #fff;
    font-size: .6rem; font-weight: 700; line-height: 1;
    padding: 4px 7px; border-radius: 8px; letter-spacing: .02em; cursor: pointer;
  }
  .tile-defer-badge:active { transform: scale(.9); }

  .card-simplelist { display: flex; flex-direction: column; margin-top: 10px; }
  .card-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 6px; border-bottom: 1px solid var(--line);
    font-size: .85rem; cursor: pointer;
  }
  .card-row:active { background: rgba(255,255,255,.5); }
  .card-row-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .row-fav-btn {
    background: none; border: none; padding: 2px; font-size: 1rem; line-height: 1;
    cursor: pointer; flex-shrink: 0; color: var(--ink);
  }
  /* Schwarze "Später"-Markierung als Chip in der Listenzeile — antippen zum Aufheben */
  .row-defer-badge {
    flex-shrink: 0; background: #1c1c1c; color: #fff; font-size: .6rem;
    font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 8px; letter-spacing: .02em;
    cursor: pointer;
  }
  .row-defer-badge:active { transform: scale(.9); }
  .row-del-btn {
    background: none; border: none; padding: 4px 6px; font-size: 1rem; line-height: 1;
    cursor: pointer; flex-shrink: 0; color: var(--again); opacity: .65;
  }
  .row-del-btn:active { opacity: 1; }

  .session-summary {
    background: var(--card-bg); border-radius: var(--radius); padding: 40px 24px;
    text-align: center; box-shadow: var(--shadow-md);
    animation: card-in .3s ease;
  }
  .session-summary .emoji-big { font-size: 2.6rem; }
  .session-summary h2 { margin-top: 8px; }
  .session-summary .stat-row { display: flex; justify-content: center; gap: 32px; margin: 24px 0; }
  .session-summary .stat { display: flex; flex-direction: column; }
  .session-summary .stat .num { font-size: 2rem; font-weight: 800; color: var(--accent-dark); }
  .session-summary .stat .label { color: var(--ink-soft); font-size: .85rem; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(44,42,38,.45);
    display: flex; align-items: flex-start; justify-content: center; padding: 24px; z-index: 50;
    backdrop-filter: blur(2px);
    overflow-y: auto;   /* Notausgang, falls der Kasten doch mal höher wird als der Schirm */
  }
  /* Ein langer Dialog (Einstellungen) darf nie über den Bildschirmrand hinaus
     wachsen — sonst sitzt "Fertig" im Nichts und ist am Rechner nicht mehr
     erreichbar. Der Kasten bleibt also höchstens so hoch wie der Schirm, der
     TEXT scrollt für sich, und die Knopfzeile bleibt immer stehen.
     margin:auto (statt align-items:center) zentriert kurze Dialoge und
     schneidet lange trotzdem nicht oben ab. */
  .modal-box {
    background: #fff; border-radius: var(--radius); padding: 26px; max-width: 400px; width: 100%;
    box-shadow: var(--shadow-lg);
    animation: card-in .2s ease;
    margin: auto;
    max-height: 100%;
    display: flex; flex-direction: column; min-height: 0;
  }
  .modal-box h3 { margin-top: 0; flex: none; }
  .modal-body {
    overflow-y: auto; min-height: 0; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    /* etwas Luft, damit die Schalter am Rand beim Scrollen nicht angeschnitten wirken */
    margin: 0 -4px; padding: 0 4px;
  }
  .modal-box .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; flex: none; }

  /* ---------- Einstellungen (Schalter) ---------- */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-text { min-width: 0; }
  .setting-label { font-weight: 700; }
  .setting-desc { color: var(--ink-soft); font-size: .82rem; margin-top: 3px; line-height: 1.35; }
  .switch {
    position: relative; flex-shrink: 0; width: 54px; height: 31px; padding: 0;
    background: var(--line); border: none; border-radius: 16px; cursor: pointer;
    transition: background .18s;
    /* iOS/iPad: ohne appearance:none überdeckt die native Button-Darstellung
       Hintergrund und Schieber (siehe Badge-Bug in einem früheren Update). */
    -webkit-appearance: none; appearance: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .18s;
  }
  .switch.on { background: var(--good); }
  .switch.on::after { transform: translateX(23px); }
  .switch:disabled { opacity: .4; cursor: default; }

  /* ---------- Werkzeugleiste in Kachel-/Listenansicht ---------- */
  .browse-toolbar { display: flex; justify-content: flex-end; margin: 6px 0 2px; }
  .undefer-all-btn {
    background: #1c1c1c; color: #fff; font-weight: 700; font-size: .85rem;
    padding: 11px 15px; border-radius: 12px; border: none;
    -webkit-appearance: none; appearance: none;
  }
  .undefer-all-btn:active { transform: scale(.97); background: #000; }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--accent-dark); color: #fff; padding: 13px 22px; border-radius: 14px;
    font-size: .9rem; max-width: 90%; text-align: center; z-index: 60;
    box-shadow: var(--shadow-md);
    animation: toast-in .2s ease;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ---------- Zeichenfeld (Apple Pencil) ----------
     Erscheint nur bei Zeichenaufgaben (siehe detectDrawing) oder wenn der
     Stift-Knopf unten rechts gedrückt wurde. Die Zeichenfläche bleibt bewusst
     immer hell — auch im Dark Mode —, weil man auf hellem Grund zeichnet. */
  .draw-block { margin: 16px 0 6px; text-align: center; }
  .draw-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; margin-bottom: 8px;
  }
  .draw-toolbar .sep { width: 1px; height: 26px; background: var(--line); margin: 0 3px; }
  /* Mindestgröße 44x44 Punkt, damit die Knöpfe auf dem iPad mit dem Finger treffbar sind */
  .draw-btn {
    width: 44px; height: 44px; min-width: 44px; padding: 0; border: none; border-radius: 12px;
    background: rgba(255,255,255,.6); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
    -webkit-appearance: none; appearance: none; cursor: pointer;
  }
  html[data-theme="dark"] .draw-btn { background: rgba(255,255,255,.08); color: var(--ink); }
  .draw-btn:active { transform: scale(.92); }
  .draw-btn:disabled { opacity: .3; }
  .draw-btn.active { box-shadow: inset 0 0 0 3px var(--accent); background: var(--accent-soft); }
  .draw-btn.eraser-on { background: var(--hard); color: #241c07; box-shadow: inset 0 0 0 3px var(--accent-dark); }
  .draw-btn.danger { color: var(--again); }
  .draw-color .dot {
    width: 22px; height: 22px; border-radius: 50%; display: block;
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  .draw-size .dot { border-radius: 50%; background: currentColor; display: block; }

  .draw-stack {
    position: relative;
    /* Rund 15 % breiter als die Textspalte: die Fläche darf in das Polster der
       Karte (26px) und den Seitenrand der Seite (20px) hineinragen und wird
       über margin-left/transform wieder mittig gestellt. Nach oben begrenzen
       100vw (damit nie quer gescrollt wird) und 84vh (Querformat). */
    width: min(calc(100% + 92px), calc(100vw - 16px), 84vh);
    margin-left: 50%;
    transform: translateX(-50%);
    aspect-ratio: 4 / 3;
    background: #fdfcf9; border: 1px solid var(--line); border-radius: 14px;
    overflow: hidden;
    /* Eigene Compositing-Ebene: Die große Zeichenfläche (Canvas + bis zu drei
       Bildebenen, rund beschnitten) muss beim Scrollen sonst jedes Bild neu
       gezeichnet werden — das war beim Scrollen als Ruckeln zu spüren. */
    will-change: transform;
    contain: paint;
  }
  html[data-theme="dark"] .draw-stack { background: #f7f5f0; border-color: #4a4237; }
  .draw-stack img.draw-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; pointer-events: none;
    /* Die Dark-Mode-Regel für Kartenbilder (weiße Unterlage) darf hier nicht greifen */
    background: none !important; padding: 0 !important; border-radius: 0; max-width: none;
  }
  .draw-template { z-index: 1; }
  .draw-prev { z-index: 2; opacity: .3; display: none; }
  .draw-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3;
    /* pan-y: der Finger scrollt NATIV (mit Schwung, ohne Nachbau in JS) —
       das ist der einzige Weg, der sich auf iPadOS flüssig anfühlt.
       Zoomen und seitliches Wischen bleiben aus, Zeichengesten mit dem Finger
       gibt es hier ohnehin keine. */
    touch-action: pan-y;
  }
  /* "Mit Finger zeichnen": dann muss die Geste beim Canvas bleiben. */
  .draw-canvas.finger-draw { touch-action: none; }

  /* ---------- Zeichnen-Sperre ----------
     Beim Schreiben liegt der Handballen oft NEBEN der weißen Fläche, auf dem
     dunklen Untergrund. Von dort startet iPadOS eine ganz normale Scroll-Geste
     — und die bricht den laufenden Stiftstrich ab (pointercancel), weshalb
     z.B. der dritte Strich eines "H" nicht mehr ankam. Dagegen hilft nur, der
     GANZEN Seite die Touch-Gesten zu nehmen, nicht nur der Zeichenfläche.
     In diesem Modus zeichnet ausschließlich der Stift; Finger und Handballen
     lösen gar nichts mehr aus (Knöpfe bleiben antippbar). */
  html.draw-lock-mode,
  html.draw-lock-mode body,
  html.draw-lock-mode #app,
  html.draw-lock-mode .draw-canvas { touch-action: none; }
  .draw-solution { z-index: 4; opacity: .5; display: none; }
  /* Bild/Tabelle, das als Hintergrundvorlage ins Canvas gewandert ist, im Text ausblenden */
  [data-draw-template] { display: none !important; }

  /* ---------- Vorlage aus der Karte selbst (Tabelle / Zeichnung) ----------
     Ein "gegeben"-Block der Vorderseite wird nicht abfotografiert, sondern als
     echtes HTML in die Zeichenfläche gelegt: bleibt bei jeder Auflösung scharf
     und braucht keinen Umweg über eine Bilddatei. Der Inhalt wird mittig
     platziert und so weit vergrößert, dass man mit dem Stift bequem in die
     Felder schreiben kann. */
  .draw-dom-layer {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .draw-template-dom { z-index: 1; }
  .draw-solution-dom { z-index: 4; opacity: .5; display: none; }
  .draw-dom-inner {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: 50% 50%;
    width: max-content; max-width: none;
  }
  /* Die Fläche ist immer hell — also auch im Dark Mode dunkle Schrift.
     Eigene Farbangaben der Karte (inline) gehen vor und bleiben erhalten. */
  .draw-dom-inner, .draw-dom-inner * { color: #16181d; }
  .draw-dom-inner table { margin: 0 !important; border-collapse: collapse; }
  .draw-solution-dom .draw-sol-fill { color: #1d6b3f; font-weight: 600; }

  .draw-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .draw-actions button { padding: 13px 16px; font-size: .9rem; font-weight: 600; }
  .draw-solve-btn { background: linear-gradient(135deg, var(--good), #468a63); color: #fff; box-shadow: var(--shadow-sm); }
  .draw-mini-btn { background: var(--line); color: var(--ink); }
  html[data-theme="dark"] .draw-mini-btn { background: rgba(255,255,255,.09); }
  .draw-overlay-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 10px; flex-wrap: wrap;
  }
  .draw-overlay-row input[type=range] { width: 150px; accent-color: var(--accent); }
  .draw-hint { color: var(--ink-soft); font-size: .76rem; margin-top: 8px; line-height: 1.4; }
  #draw-persist:not(:empty) { margin: 2px 0 14px; }
  /* Die Höhe der Knöpfe steckt in --fab-bottom: Auf schmalen Geräten (iPhone)
     reicht die Kartenspalte bis an den rechten Rand, dann läge der Stift-Knopf
     genau auf der "Leicht"-Taste. updateFabDodge() hebt den Stapel dann über
     die Bewertungsreihe. Auf dem iPad bleibt daneben Platz — dort rührt sich
     nichts. */
  .draw-pen-fab {
    position: fixed; right: 16px; bottom: var(--fab-bottom, 16px); z-index: 45;
    width: 54px; height: 54px; border-radius: 50%; padding: 0; border: none;
    background: var(--card-bg); color: var(--ink); box-shadow: var(--shadow-md);
    font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none; appearance: none;
    transition: bottom .16s ease;
  }
  .draw-pen-fab:active { transform: scale(.93); }
  .draw-pen-fab.active { background: var(--accent-soft); box-shadow: var(--shadow-md), inset 0 0 0 3px var(--accent); }
  /* Zeichnen-Sperre — sitzt direkt über dem Stift-Knopf */
  .draw-lock-fab { bottom: calc(var(--fab-bottom, 16px) + 64px); }
  .draw-lock-fab.active {
    background: var(--hard); color: #241c07;
    box-shadow: var(--shadow-md), inset 0 0 0 3px var(--accent-dark);
  }

  /* Diagnose-Anzeige (Einstellungen -> Leistungsanzeige) */
  #diag-hud {
    position: fixed; top: 8px; left: 8px; z-index: 90;
    max-width: min(92vw, 480px);
    background: rgba(0,0,0,.78); color: #7dff9b;
    font: 600 10.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    padding: 6px 9px 8px; border-radius: 8px;
    pointer-events: none; letter-spacing: .01em;
  }
  #diag-text { white-space: pre; overflow-x: auto; }
  #diag-copy, #diag-mark {
    pointer-events: auto; margin-top: 6px; padding: 7px 10px;
    font: 600 11px/1 -apple-system, sans-serif;
    background: #7dff9b; color: #062a12; border: none; border-radius: 6px;
    -webkit-appearance: none; appearance: none;
  }
  #diag-mark { background: #ff9b7d; color: #2a0f06; margin-right: 6px; }

  #file-input { display: none; }

  @media (min-width: 600px) {
    .flashcard { font-size: 1.4rem; }
  }
</style>

<body>
<div id="app"></div>
<div id="toast-container"></div>

<script>
/* ======================================================================
   Karteikarten-App — Anki-.apkg-Reader mit SM-2-Wiederholungsalgorithmus
   Reines HTML/CSS/JS, keine Build-Schritte, keine Server-Komponente.
   ====================================================================== */

/* ---------------------------------------------------------------------
   IndexedDB-Zugriffsschicht
   Object Stores:
     decks: { id, name, importDate, newPerDay, newIntroducedToday, newIntroducedDate }
     cards: { id, deckId, front, back, ease, interval, reps, due, lapses, firstReviewDone, created }
     sketches: { cardId, dataUrl, savedAt }   (ab Version 2, für "Skizze behalten")

   VERSIONSMIGRATION: onupgradeneeded legt nur an, was noch fehlt. Bestehende
   Stapel und ihr Lernfortschritt bleiben beim Update auf Version 2 unangetastet
   — es kommt lediglich der neue Store "sketches" dazu.
   --------------------------------------------------------------------- */
const DB_NAME = 'karteikartenDB';
const DB_VERSION = 2;
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('decks')) {
        db.createObjectStore('decks', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('cards')) {
        const store = db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
        store.createIndex('deckId', 'deckId', { unique: false });
      }
      // Version 2: gespeicherte Skizzen (eine pro Karte)
      if (!db.objectStoreNames.contains('sketches')) {
        db.createObjectStore('sketches', { keyPath: 'cardId' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

function tx(storeNames, mode) {
  return openDB().then(db => db.transaction(storeNames, mode));
}

function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const Store = {
  async addDeck(deck) {
    const t = await tx(['decks'], 'readwrite');
    const id = await reqToPromise(t.objectStore('decks').add(deck));
    return id;
  },
  async updateDeck(deck) {
    const t = await tx(['decks'], 'readwrite');
    await reqToPromise(t.objectStore('decks').put(deck));
  },
  async getDeck(id) {
    const t = await tx(['decks'], 'readonly');
    return reqToPromise(t.objectStore('decks').get(id));
  },
  async getAllDecks() {
    const t = await tx(['decks'], 'readonly');
    return reqToPromise(t.objectStore('decks').getAll());
  },
  async deleteDeck(id) {
    const t = await tx(['decks', 'cards', 'sketches'], 'readwrite');
    t.objectStore('decks').delete(id);
    const sketchStore = t.objectStore('sketches');
    const idx = t.objectStore('cards').index('deckId');
    const cursorReq = idx.openCursor(IDBKeyRange.only(id));
    await new Promise((resolve, reject) => {
      cursorReq.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          sketchStore.delete(cursor.value.id);   // gespeicherte Skizze mit entsorgen
          cursor.delete(); cursor.continue();
        }
        else resolve();
      };
      cursorReq.onerror = () => reject(cursorReq.error);
    });
  },
  async findDeckByName(name) {
    const decks = await this.getAllDecks();
    return decks.find(d => d.name === name);
  },
  async addCards(cards) {
    const t = await tx(['cards'], 'readwrite');
    const store = t.objectStore('cards');
    for (const c of cards) store.add(c);
    await new Promise((resolve, reject) => {
      t.oncomplete = resolve;
      t.onerror = () => reject(t.error);
    });
  },
  async getCardsForDeck(deckId) {
    const t = await tx(['cards'], 'readonly');
    const idx = t.objectStore('cards').index('deckId');
    return reqToPromise(idx.getAll(IDBKeyRange.only(deckId)));
  },
  async updateCard(card) {
    const t = await tx(['cards'], 'readwrite');
    await reqToPromise(t.objectStore('cards').put(card));
  },
  async deleteCard(id) {
    const t = await tx(['cards'], 'readwrite');
    await reqToPromise(t.objectStore('cards').delete(id));
    this.deleteSketch(id).catch(() => {});
  },

  /* Gespeicherte Skizzen ("Skizze behalten"): höchstens eine pro Karte, die
     jeweils neueste. Fehler werden bewusst geschluckt — eine fehlende Skizze
     darf das Lernen nie blockieren. */
  async saveSketch(cardId, dataUrl) {
    const t = await tx(['sketches'], 'readwrite');
    await reqToPromise(t.objectStore('sketches').put({ cardId, dataUrl, savedAt: Date.now() }));
  },
  async getSketch(cardId) {
    const t = await tx(['sketches'], 'readonly');
    return reqToPromise(t.objectStore('sketches').get(cardId));
  },
  async deleteSketch(cardId) {
    const t = await tx(['sketches'], 'readwrite');
    await reqToPromise(t.objectStore('sketches').delete(cardId));
  }
};

/* ---------------------------------------------------------------------
   .apkg-Import: ZIP entpacken, SQLite lesen, Notiztypen anwenden
   --------------------------------------------------------------------- */
let SQL = null;
async function getSQL() {
  if (SQL) return SQL;
  SQL = await initSqlJs({
    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
  });
  return SQL;
}

async function parseApkg(file) {
  const zip = await JSZip.loadAsync(file);

  let dbFile = zip.file('collection.anki21') || zip.file('collection.anki2');
  if (!dbFile) {
    if (zip.file('collection.anki21b')) {
      throw new Error('Diese Datei nutzt ein neueres Anki-Format, das noch nicht unterstützt wird');
    }
    throw new Error('Keine gültige Anki-Sammlung in dieser Datei gefunden');
  }

  const dbBytes = await dbFile.async('uint8array');
  const sql = await getSQL();
  const db = new sql.Database(dbBytes);

  // Medien-Zuordnung (Nummer -> Dateiname) laden, falls vorhanden
  let mediaMap = {};
  const mediaFile = zip.file('media');
  if (mediaFile) {
    try {
      mediaMap = JSON.parse(await mediaFile.async('text'));
    } catch (e) { mediaMap = {}; }
  }
  // Object-URLs für Mediendateien vorbereiten (Nummer -> blob-URL)
  const mediaUrls = {};
  for (const [num, filename] of Object.entries(mediaMap)) {
    const entry = zip.file(num);
    if (entry) {
      try {
        const blob = await entry.async('blob');
        mediaUrls[filename] = URL.createObjectURL(blob);
      } catch (e) { /* Mediendatei defekt/fehlt: ignorieren */ }
    }
  }

  const colRes = db.exec('SELECT models FROM col LIMIT 1');
  if (!colRes.length) throw new Error('Keine Modell-Informationen in der Datenbank gefunden');
  const modelsJson = colRes[0].values[0][0];
  const models = JSON.parse(modelsJson);

  // tags: von Anki durch Leerzeichen getrennt — wird für die Zeichenfeld-
  // Erkennung gebraucht (Tag "zeichnen", siehe detectDrawing).
  const notesRes = db.exec('SELECT id, mid, flds, tags FROM notes');
  const notesById = {};
  if (notesRes.length) {
    for (const row of notesRes[0].values) {
      notesById[row[0]] = { mid: row[1], flds: row[2], tags: row[3] || '' };
    }
  }

  const cardsRes = db.exec('SELECT id, nid, ord FROM cards');
  const cardRows = cardsRes.length ? cardsRes[0].values : [];

  const parsedCards = [];
  for (const [cardId, nid, ord] of cardRows) {
    const note = notesById[nid];
    if (!note) continue;
    const model = models[note.mid];
    if (!model) continue;

    const fieldNames = model.flds.map(f => f.name);
    const fieldValues = note.flds.split('\x1f');
    const fieldsMap = {};
    fieldNames.forEach((name, i) => { fieldsMap[name] = fieldValues[i] || ''; });

    // MC-Karte Shuffle: Optionen werden nicht statisch gerendert, sondern bei
    // jedem Anzeigen live gemischt (siehe renderMcCard). Deshalb hier nur die
    // Rohfelder mitnehmen statt fertiges Front-/Back-HTML zu erzeugen.
    if (isMcShuffleNote(fieldsMap)) {
      parsedCards.push({
        front: '', back: '', css: '', tags: note.tags,
        mcData: {
          frage: insertMedia(fieldsMap['Frage'] || '', mediaUrls),
          options: ['A', 'B', 'C', 'D'].map(f => insertMedia(fieldsMap[f] || '', mediaUrls)),
          correctIndex: parseInt(fieldsMap['AntwortNr'], 10) || 0,
          richtigText: insertMedia(fieldsMap['RichtigText'] || '', mediaUrls),
          erklaerung: insertMedia(fieldsMap['Erklaerung'] || '', mediaUrls)
        }
      });
      continue;
    }

    const isClozeModel = model.type === 1;
    const tmpl = isClozeModel ? model.tmpls[0] : model.tmpls[ord];
    if (!tmpl) continue;

    let frontHtml = renderTemplate(tmpl.qfmt, fieldsMap, ord, true, '');
    let backHtml = renderTemplate(tmpl.afmt, fieldsMap, ord, false, frontHtml);

    frontHtml = insertMedia(frontHtml, mediaUrls);
    backHtml = insertMedia(backHtml, mediaUrls);

    // [zeichenfeld:datei.png] auf die entpackte Mediendatei umbiegen, solange
    // die Zuordnung Dateiname -> Blob-URL noch bekannt ist.
    frontHtml = resolveDrawTemplateMarker(frontHtml, mediaUrls);
    backHtml = resolveDrawTemplateMarker(backHtml, mediaUrls);

    // Die CSS des Notiztyps wird mitgenommen, damit z.B. Multiple-Choice-Layouts,
    // Farben und Abstände wie im echten Anki dargestellt werden können.
    parsedCards.push({ front: frontHtml, back: backHtml, css: model.css || '', tags: note.tags });
  }

  db.close();
  return parsedCards;
}

function insertMedia(html, mediaUrls) {
  return html.replace(/src="([^"]+)"/g, (match, src) => {
    if (mediaUrls[src]) return `src="${mediaUrls[src]}"`;
    return match; // Bild fehlt: Original-Pfad belassen, kein Absturz
  });
}

// [zeichenfeld:dateiname.png] -> [zeichenfeld:blob:...] . Ohne diesen Schritt
// wäre der Dateiname nach dem Import nicht mehr auflösbar, weil im Karten-HTML
// nur noch Blob-URLs stehen. Unbekannte Namen bleiben unverändert stehen.
function resolveDrawTemplateMarker(html, mediaUrls) {
  return (html || '').replace(/\[zeichenfeld\s*:\s*([^\]]+?)\s*\]/gi, (m, name) => {
    const url = mediaUrls[name.trim()];
    return url ? `[zeichenfeld:${url}]` : m;
  });
}

// Erkennt Notizen vom Typ "MC-Karte Shuffle" anhand ihrer Felder (nicht am
// Notiztyp-Namen, da der beim Export leicht abweichen kann).
function isMcShuffleNote(fieldsMap) {
  return ['Frage', 'A', 'B', 'C', 'D', 'AntwortNr'].every(f => f in fieldsMap);
}

/* ---------------------------------------------------------------------
   Template-Rendering (Ankis {{Feld}}, {{#Feld}}, {{^Feld}}, {{cloze:Feld}})
   --------------------------------------------------------------------- */
function renderTemplate(tmplStr, fieldsMap, ord, isFront, frontSideHtml) {
  let out = tmplStr || '';

  // {{FrontSide}} nur auf der Rückseite relevant
  out = out.replace(/\{\{FrontSide\}\}/g, frontSideHtml || '');

  // Bedingte Abschnitte: {{#Feld}}...{{/Feld}} (nur wenn Feld nicht leer)
  let changed = true;
  let guard = 0;
  while (changed && guard < 20) {
    changed = false;
    guard++;
    out = out.replace(/\{\{#([^}#^\/]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (m, field, inner) => {
      changed = true;
      const val = (fieldsMap[field.trim()] || '').trim();
      return val ? inner : '';
    });
    out = out.replace(/\{\{\^([^}#^\/]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (m, field, inner) => {
      changed = true;
      const val = (fieldsMap[field.trim()] || '').trim();
      return val ? '' : inner;
    });
  }

  // Cloze-Platzhalter: {{cloze:Feld}}
  out = out.replace(/\{\{cloze:([^}]+)\}\}/g, (m, field) => {
    const text = fieldsMap[field.trim()] || '';
    return renderCloze(text, ord, isFront);
  });

  // Normale Feld-Platzhalter (inkl. Filter wie {{type:Feld}}, Filter wird ignoriert)
  out = out.replace(/\{\{([^#\^\/][^}]*)\}\}/g, (m, expr) => {
    const parts = expr.split(':');
    const field = parts[parts.length - 1].trim();
    return fieldsMap[field] !== undefined ? fieldsMap[field] : '';
  });

  return out;
}

function renderCloze(text, ord, isFront) {
  const targetNum = ord + 1;
  return text.replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, (m, numStr, content, hint) => {
    const num = parseInt(numStr, 10);
    if (num === targetNum) {
      if (isFront) return hint ? `[${hint}]` : '[...]';
      return `<span class="cloze-answer">${content}</span>`;
    }
    return content;
  });
}

// Beschränkt die vom Notiztyp mitgelieferte CSS auf unseren Karten-Wrapper,
// damit sie nicht den Rest der App beeinflusst. ".card" ist Ankis Konvention
// für den äußeren Karten-Container und wird direkt auf die Wrapper-Klasse gemappt.
// (Einfache, regelbasierte Lösung — deckt die typische flache CSS-Struktur von
// Anki-Notiztypen ab; @media-Bedingungen werden dabei unverändert durchgereicht.)
function scopeCss(css, scopeClass) {
  if (!css) return '';
  return css.replace(/([^{}]+)\{([^{}]*)\}/g, (match, selectorPart, body) => {
    const trimmed = selectorPart.trim();
    if (trimmed.startsWith('@')) return match;
    const scoped = trimmed.split(',').map(sel => {
      sel = sel.trim();
      if (sel === '.card') return `.${scopeClass}`;
      return `.${scopeClass} ${sel}`;
    }).join(', ');
    return `${scoped} { ${body} }`;
  });
}

/* ---------------------------------------------------------------------
   Wiederholungsalgorithmus mit Lernschritten
   ---------------------------------------------------------------------
   Vier Bewertungen + ein "Später"-Button (siehe deferCard).
   - LERNPHASE (neue + zurückgestufte Karten, interval < 1 Tag):
       Nochmal = 2 Min, Schwer = 6 Min, Gut = 15 Min, Leicht = 1 Tag (graduiert).
   - WIEDERHOLPHASE (interval >= 1 Tag):
       Nochmal = 2 Min, Schwer = 6 Min (beide zurück in die Lernphase),
       Gut = HÄLT das aktuelle Intervall (wird nie größer/kleiner),
       Leicht = ERHÖHT: verdoppeln, aber gedeckelt bei 4 Tagen (1->2->4->4...).
   Nur Leicht vergrößert das Intervall; Gut hält es konstant. Karten in der
   Lernphase kommen INNERHALB der Sitzung nach ihren Minuten wieder (pickNextCard).
   card.mastered = zuletzt mindestens Gut bewertet (true) bzw. Nochmal/Schwer/neu
   (false) — steuert, wann zurückgestellte Karten wieder freigegeben werden.
   Alles arbeitet nur mit vorhandenen Kartenfeldern -> bestehende Stapel ohne
   Neu-Import kompatibel.
   --------------------------------------------------------------------- */
const ONE_DAY_MS = 24 * 60 * 60 * 1000;
const STEP_AGAIN_MS = 2 * 60 * 1000;    // 2 Minuten
const STEP_HARD_MS  = 6 * 60 * 1000;    // 6 Minuten
const STEP_GOOD_MS  = 15 * 60 * 1000;   // 15 Minuten
const LEICHT_CAP_DAYS = 4;              // Leicht deckelt bei 4 Tagen

// Ist die Karte noch in der Lernphase (Minuten-Schritte)?
function isLearningCard(card) {
  return !card.firstReviewDone || (card.interval || 0) < 1;
}

// Die vier nächsten Intervalle (in Tagen, ggf. Bruchteile) für die Karte, OHNE
// Mutation — für die Anzeige auf den Buttons und als Grundlage für scheduleCard.
function previewSchedule(card) {
  if (isLearningCard(card)) {
    return {
      1: STEP_AGAIN_MS / ONE_DAY_MS,   // Nochmal: 2 Min
      3: STEP_HARD_MS / ONE_DAY_MS,    // Schwer: 6 Min
      4: STEP_GOOD_MS / ONE_DAY_MS,    // Gut: 15 Min
      5: 1,                            // Leicht: 1 Tag (graduiert)
    };
  }
  const iv = card.interval || 1;
  return {
    1: STEP_AGAIN_MS / ONE_DAY_MS,     // Nochmal: 2 Min
    3: STEP_HARD_MS / ONE_DAY_MS,      // Schwer: 6 Min
    4: iv,                             // Gut: Intervall bleibt gleich
    5: Math.min(LEICHT_CAP_DAYS, Math.max(2, Math.round(iv * 2))), // Leicht: verdoppeln, max 4 Tage
  };
}

// Wendet die Bewertung an. Rückgabe { learning }: true = Karte bleibt in der
// Sitzung (Minuten-Schritt, kommt gleich wieder), false = auf Tage geplant und
// verlässt die aktive Warteschlange.
function scheduleCard(card, q) {
  const now = Date.now();
  const learning = isLearningCard(card);

  if (q === 1) {                 // Nochmal -> 2 Min, zurück in die Lernphase
    if (!learning) card.lapses = (card.lapses || 0) + 1;
    card.reps = 0;
    card.mastered = false;
    card.interval = STEP_AGAIN_MS / ONE_DAY_MS;
    card.due = now + STEP_AGAIN_MS;
    return { learning: true };
  }
  if (q === 3) {                 // Schwer -> 6 Min, zurück in die Lernphase
    card.reps = 0;
    card.mastered = false;
    card.interval = STEP_HARD_MS / ONE_DAY_MS;
    card.due = now + STEP_HARD_MS;
    return { learning: true };
  }

  // Gut (4) und Leicht (5) gelten als "gekonnt"
  card.mastered = true;

  if (q === 4) {                 // Gut -> Intervall HALTEN (nie größer/kleiner)
    if (learning) {
      card.interval = STEP_GOOD_MS / ONE_DAY_MS;   // 15 Min, bleibt Lernphase
      card.due = now + STEP_GOOD_MS;
      return { learning: true };
    }
    card.reps = (card.reps || 0) + 1;
    card.due = now + Math.round((card.interval || 1) * ONE_DAY_MS); // gleiches Intervall
    return { learning: false };
  }

  // q === 5, Leicht -> ERHÖHEN (verdoppeln, max 4 Tage)
  const days = learning
    ? 1                                                              // graduiert auf 1 Tag
    : Math.min(LEICHT_CAP_DAYS, Math.max(2, Math.round((card.interval || 1) * 2)));
  card.reps = (card.reps || 0) + 1;
  card.interval = days;
  card.due = now + Math.round(days * ONE_DAY_MS);
  return { learning: false };
}

// Menschliche Kurzform eines Intervalls (in Tagen) für die Button-Anzeige.
function fmtInterval(days) {
  const mins = Math.round(days * 24 * 60);
  if (mins < 60) return mins + ' Min';
  if (mins < 60 * 24) { const h = Math.round(mins / 60); return h + ' Std'; }
  const d = Math.round(days);
  if (d < 30) return d + (d === 1 ? ' Tag' : ' Tage');
  if (d < 365) { const mo = Math.round(d / 30); return mo + ' Mon'; }
  const y = d / 365;
  return (y < 10 ? y.toFixed(1) : Math.round(y)) + ' J';
}

function newCardState() {
  return { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: Date.now(), firstReviewDone: false, mastered: false, deferred: false };
}

// Fortschritts-Kennzahlen pro Stapel für die Startseite
function computeDeckStats(cards, deck) {
  const total = cards.length;
  const learned = cards.filter(c => c.firstReviewDone).length;
  const mature = cards.filter(c => c.interval >= 21).length; // "reif" wie in Anki üblich
  const newCount = total - learned;
  const progressPct = total > 0 ? Math.round((learned / total) * 100) : 0;
  const daysLeft = newCount > 0 ? Math.ceil(newCount / (deck.newPerDay || 20)) : 0;
  return { total, learned, mature, newCount, progressPct, daysLeft };
}

/* ---------------------------------------------------------------------
   Design / Dark Mode
   ---------------------------------------------------------------------
   Drei Einstellungen, gespeichert in localStorage:
     'auto'  = folgt der Systemeinstellung des Geräts (Standard)
     'light' = immer hell
     'dark'  = immer dunkel
   Gesetzt wird data-theme am <html>; das eigentliche Umfärben macht CSS.
   Karteninhalte werden zusätzlich behandelt (siehe adaptCardForDark), damit
   dunkler Text aus Anki-Notiztypen im Dark Mode nicht unsichtbar wird.
   --------------------------------------------------------------------- */
const THEME_KEY = 'karteikarten-theme';
const darkMediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

function getThemePref() {
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function setThemePref(pref) {
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) { /* privater Modus: gilt nur für diese Sitzung */ }
  applyTheme();
}
function systemPrefersDark() {
  return !!(darkMediaQuery && darkMediaQuery.matches);
}
function effectiveTheme() {
  const pref = getThemePref();
  return pref === 'auto' ? (systemPrefersDark() ? 'dark' : 'light') : pref;
}
function isDarkMode() {
  return document.documentElement.getAttribute('data-theme') === 'dark';
}
function applyTheme() {
  const theme = effectiveTheme();
  document.documentElement.setAttribute('data-theme', theme);
  const meta = document.getElementById('theme-color-meta');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1815' : '#f7f5f2');
  // Ist gerade eine Karte zu sehen, muss sie komplett neu gezeichnet werden:
  // die Notiztyp-CSS wird erst beim Zeichnen ans Design angepasst.
  if (document.getElementById('flashcard')) renderCurrentCardView();
}
// Zeichnet die gerade sichtbare Kartenansicht neu (Durchsehen oder Lernen).
// War die Rückseite gerade aufgedeckt, bleibt sie das auch danach — sonst
// springt die Karte beim Umschalten des Designs zurück auf die Frage.
function renderCurrentCardView() {
  const backWrap = document.getElementById('card-back-wrap');
  const wasRevealed = !!backWrap && backWrap.style.display === 'block';
  if (browseSession) renderBrowseView();
  else if (currentSession && currentSession.current) renderStudyView();
  else return;
  if (wasRevealed) toggleCardFace();
}
if (darkMediaQuery && darkMediaQuery.addEventListener) {
  darkMediaQuery.addEventListener('change', () => { if (getThemePref() === 'auto') applyTheme(); });
}

function openSettings() {
  const pref = getThemePref();
  const dark = effectiveTheme() === 'dark';
  const auto = pref === 'auto';
  showModal({
    title: '⚙️ Einstellungen',
    body: `
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">🌙 Dark Mode</div>
          <div class="setting-desc">Dunkle Oberfläche fürs Lernen am Abend — schont die Augen.</div>
        </div>
        <button class="switch ${dark ? 'on' : ''}" id="switch-dark" ${auto ? 'disabled' : ''} aria-label="Dark Mode"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">Automatisch</div>
          <div class="setting-desc">Folgt der Einstellung des Geräts (hell am Tag, dunkel in der Nacht).</div>
        </div>
        <button class="switch ${auto ? 'on' : ''}" id="switch-auto" aria-label="Automatisch"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">✏️ Mit Finger zeichnen erlauben</div>
          <div class="setting-desc">Normalerweise zeichnet nur der Apple Pencil — der Handballen erzeugt keine Striche. Am Rechner oder ohne Pencil hier einschalten.</div>
        </div>
        <button class="switch ${fingerDrawingEnabled() ? 'on' : ''}" id="switch-finger" aria-label="Mit Finger zeichnen"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">📐 Formen automatisch begradigen</div>
          <div class="setting-desc">Strich zeichnen, den Stift am Ende kurz gedrückt halten — Linie, Kreis, Rechteck oder Pfeil werden sauber gezogen und rasten auf Waagerechte, Senkrechte und 45° ein.</div>
        </div>
        <button class="switch ${straightenEnabled() ? 'on' : ''}" id="switch-straighten" aria-label="Formen begradigen"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">✋ Zeichnen-Sperre</div>
          <div class="setting-desc">Zum Schreiben mit dem Pencil: Die Seite nimmt keine Finger- und Handballen-Gesten mehr an, damit die aufliegende Hand keinen Strich mehr abbricht. Gescrollt wird dann nicht — zum Weiterlesen wieder ausschalten. Geht auch direkt über den Knopf ✋ unten rechts.</div>
        </div>
        <button class="switch ${drawLockMode() ? 'on' : ''}" id="switch-drawlock" aria-label="Zeichnen-Sperre"></button>
      </div>
      <div class="setting-row">
        <div class="setting-text">
          <div class="setting-label">🔬 Leistungsanzeige</div>
          <div class="setting-desc">Zeigt oben links Bilder pro Sekunde und die Zahl der Aussetzer beim Scrollen. Nur zur Fehlersuche gedacht.</div>
        </div>
        <button class="switch ${diagnosticsEnabled() ? 'on' : ''}" id="switch-diag" aria-label="Leistungsanzeige"></button>
      </div>
      <!-- Damit man auf dem iPad sofort sieht, ob ein Update angekommen ist -->
      <div class="setting-desc" style="margin-top:16px; text-align:center; opacity:.65">
        Fassung vom ${escapeHtml(document.lastModified)}
      </div>`,
    actions: [{ label: 'Fertig', class: 'primary' }]
  });

  const darkSwitch = document.getElementById('switch-dark');
  const autoSwitch = document.getElementById('switch-auto');

  const fingerSwitch = document.getElementById('switch-finger');
  fingerSwitch.addEventListener('click', () => {
    const on = !fingerDrawingEnabled();
    lsSet(DRAW_PREF.finger, on ? '1' : '0');
    fingerSwitch.classList.toggle('on', on);
    // Mit dem Finger zeichnen und mit dem Finger scrollen schließen sich aus:
    // beim Zeichnen muss die Touch-Geste dauerhaft gesperrt bleiben.
    if (drawField && drawField.applyFingerMode) drawField.applyFingerMode();
  });
  const straightenSwitch = document.getElementById('switch-straighten');
  straightenSwitch.addEventListener('click', () => {
    const on = !straightenEnabled();
    lsSet(DRAW_PREF.straighten, on ? '1' : '0');
    straightenSwitch.classList.toggle('on', on);
  });
  const lockSwitch = document.getElementById('switch-drawlock');
  lockSwitch.addEventListener('click', () => setDrawLockMode(!drawLockMode()));
  const diagSwitch = document.getElementById('switch-diag');
  diagSwitch.addEventListener('click', () => {
    const on = !diagnosticsEnabled();
    lsSet(DRAW_PREF.diag, on ? '1' : '0');
    diagSwitch.classList.toggle('on', on);
    applyDiagnostics();
  });

  function refresh() {
    const nowAuto = getThemePref() === 'auto';
    const nowDark = effectiveTheme() === 'dark';
    darkSwitch.classList.toggle('on', nowDark);
    darkSwitch.disabled = nowAuto;
    autoSwitch.classList.toggle('on', nowAuto);
  }

  darkSwitch.addEventListener('click', () => {
    if (darkSwitch.disabled) return;
    setThemePref(effectiveTheme() === 'dark' ? 'light' : 'dark');
    refresh();
  });
  autoSwitch.addEventListener('click', () => {
    // Automatik aus: aktuellen Zustand als feste Wahl übernehmen
    setThemePref(getThemePref() === 'auto' ? (systemPrefersDark() ? 'dark' : 'light') : 'auto');
    refresh();
  });
}

/* ---------------------------------------------------------------------
   Karteninhalte im Dark Mode lesbar halten
   ---------------------------------------------------------------------
   Anki-Karten bringen zwei eigene Farbquellen mit:
   1. die CSS des Notiztyps (z.B. "background: white; color: black") —
      Hintergrund-Angaben werden im Dark Mode entfernt (sonst leuchtet die
      Karte weiß), dunkle Schriftfarben werden aufgehellt statt verworfen,
      damit z.B. rote Hinweise rot bleiben (stripColorDeclarations).
   2. Inline-Styles im Karten-HTML (style="color:#000", <font color>) —
      die werden nach dem Zeichnen geprüft und nur dann aufgehellt, wenn der
      Text sonst zu dunkel für den dunklen Kartenhintergrund wäre
      (adaptCardForDark). Elemente mit eigenem hellem Hintergrund (z.B. ein
      Tabellenkopf mit "background:#eef2f8") bekommen umgekehrt eine dunkle
      Schriftfarbe — sonst stünde dort die helle App-Schrift weiß auf weiß.
   --------------------------------------------------------------------- */
function stripColorDeclarations(css) {
  if (!css) return '';
  return css.replace(/([^{}]+)\{([^{}]*)\}/g, (match, selectorPart, body) => {
    if (selectorPart.trim().startsWith('@')) return match;
    const kept = body.split(';').map(decl => {
      if (/^\s*(background|background-color|background-image)\s*:/i.test(decl)) return null;
      const colorMatch = /^(\s*color\s*:\s*)(.+)$/i.exec(decl);
      if (colorMatch) {
        const c = resolveCssColor(colorMatch[2].replace(/!important/i, '').trim());
        if (!c) return null;                                   // unlesbarer Wert: lieber erben
        if (relLuminance(c) >= .45) return decl;                // schon hell genug
        return colorMatch[1] + lightenTextColor(c);
      }
      return decl;
    }).filter(d => d !== null).join(';');
    return `${selectorPart}{${kept}}`;
  });
}

// Wandelt eine beliebige CSS-Farbangabe ("black", "#333", "rgb(...)", "hsl(...)")
// in RGB-Werte um. Der Canvas normalisiert dabei alle Schreibweisen für uns.
const colorProbe = document.createElement('canvas').getContext('2d');
function resolveCssColor(str) {
  if (!str) return null;
  colorProbe.fillStyle = '#000000';
  colorProbe.fillStyle = str;
  const first = colorProbe.fillStyle;
  colorProbe.fillStyle = '#ffffff';
  colorProbe.fillStyle = str;
  // Ungültige Angaben lassen fillStyle unverändert -> zwei verschiedene Ergebnisse
  if (first !== colorProbe.fillStyle) return null;
  return parseCssColor(first);
}

function parseCssColor(str) {
  if (!str) return null;
  const hex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(str.trim());
  if (hex) {
    let h = hex[1];
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16), a: 1 };
  }
  const m = /rgba?\(([^)]+)\)/.exec(str);
  if (!m) return null;
  const p = m[1].split(/[,\s/]+/).filter(Boolean).map(v => parseFloat(v));
  if (p.length < 3 || p.some(v => isNaN(v))) return null;
  return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
}
function relLuminance(c) {
  return (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b) / 255;
}
// Helle Textfarbe -> dunkler machen. Gegenstück zu lightenTextColor, gebraucht
// für Text auf einer hellen Insel (z.B. Tabellenkopf mit hellem Hintergrund):
// dort ist die helle Schriftfarbe der App unsichtbar.
function darkenTextColor(c) {
  const hsl = toHsl(c);
  if (hsl.d < .08) return '#16181d';                    // praktisch grau/weiß
  return `hsl(${hsl.h}, ${Math.round(Math.min(1, hsl.s * 1.1) * 100)}%, 28%)`;
}
// Dunkle Textfarbe -> heller machen. Neutrales Schwarz/Grau wird zur normalen
// Schriftfarbe der App, farbige Töne behalten ihren Farbton.
function lightenTextColor(c) {
  const hsl = toHsl(c);
  if (hsl.d < .08) return 'var(--ink)';                 // praktisch grau/schwarz
  return `hsl(${hsl.h}, ${Math.round(Math.min(1, hsl.s * 1.1) * 100)}%, 72%)`;
}
function toHsl(c) {
  const r = c.r / 255, g = c.g / 255, b = c.b / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  const l = (max + min) / 2;
  if (d < .0001) return { h: 0, s: 0, l, d };
  const s = d / (1 - Math.abs(2 * l - 1));
  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h = Math.round(h * 60); if (h < 0) h += 360;
  return { h, s, l, d };
}

function adaptCardForDark(root) {
  if (!root || !isDarkMode()) return;
  // Reihenfolge von querySelectorAll ist Dokumentreihenfolge: Eltern werden vor
  // ihren Kindern markiert, deshalb greift closest() weiter unten schon.
  root.querySelectorAll('*').forEach(el => {
    const tag = el.tagName;
    if (tag === 'STYLE' || tag === 'SCRIPT' || tag === 'IMG' || tag === 'BR') return;
    const cs = getComputedStyle(el);
    const bg = parseCssColor(cs.backgroundColor);
    if (bg && bg.a > .5 && relLuminance(bg) > .5) el.setAttribute('data-light-island', '');
    // Helle Insel = eigener heller Hintergrund (z.B. Tabellenkopf) oder in einer
    // solchen Box liegend. Dort gilt die umgekehrte Regel: Text muss dunkel sein,
    // sonst steht die helle Schriftfarbe der App weiß auf weiß.
    const onLight = el.hasAttribute('data-light-island') || !!el.closest('[data-light-island]');
    const col = parseCssColor(cs.color);
    if (!col || col.a < .1) return;
    if (onLight) {
      if (relLuminance(col) > .45) el.style.color = darkenTextColor(col);
    } else if (relLuminance(col) < .45) {
      el.style.color = lightenTextColor(col);
    }
  });
}

/* =====================================================================
   ZEICHENFELD (Apple Pencil)
   =====================================================================
   Eine Ergänzung zur Kartenansicht — der Abfrage-Ablauf, SM-2 und der
   gespeicherte Lernfortschritt werden davon nicht berührt.

   Das Feld erscheint automatisch, wenn eine dieser vier Bedingungen greift
   (in dieser Reihenfolge geprüft, siehe detectDrawing):
     1. Platzhalter [zeichenfeld] bzw. [zeichenfeld:bild.png] im Fragetext
     2. Anki-Tag "zeichnen" an der Notiz
     3. Fragetext beginnt mit einer Wendung aus DRAW_TEXT_PATTERNS
     4. Die Vorderseite zeigt unter "gegeben" eine Tabelle oder eine Skizze
        bzw. eine Tabelle mit mehreren Leerfeldern (siehe findGivenTemplate)
   Zusätzlich lässt es sich mit dem Stift-Knopf unten rechts für die aktuelle
   Karte manuell ein- und ausschalten.

   Gezeichnet wird über Pointer Events auf einer transparenten Ebene ÜBER der
   Vorlage — deshalb radiert der Radierer nie die Vorlage weg. Vorlage ist
   entweder ein Bild (Ebene .draw-template) oder das "gegeben"-Element der
   Karte selbst, das als echtes HTML in .draw-template-dom liegt.
   --------------------------------------------------------------------- */

// Platzhalter im Kartentext. Optionaler Teil nach dem Doppelpunkt = Dateiname
// der Bildvorlage.
const DRAW_MARKER_RE = /\[zeichenfeld(?:\s*:\s*([^\]]+?))?\s*\]/i;
const DRAW_MARKER_RE_G = /\[zeichenfeld(?:\s*:\s*([^\]]+?))?\s*\]/gi;

// Anki-Tag, der eine Karte zur Zeichenkarte macht.
const DRAW_TAG = 'zeichnen';

// Rückfallebene: Fragen, die so BEGINNEN, gelten als Zeichenaufgabe.
// Bewusst als Liste angelegt — hier lässt sich später einfach ergänzen.
const DRAW_TEXT_PATTERNS = [
  /^zeichne/i,
  /^zeichnen\s+sie/i,
  /^skizziere/i,
  /^skizzieren\s+sie/i,
  /^tragen\s+sie[\s\S]{0,120}?\bein\b/i,
  /^beschriften\s+sie/i
];

// Die vier Formerkennungen lassen sich hier einzeln abschalten. Der Nutzer
// schaltet über die Einstellungen das Begradigen als Ganzes an/aus.
const SHAPE_RECOGNIZERS = { arrow: true, ellipse: true, rect: true, line: true };

const DRAW_COLORS = [
  { name: 'Schwarz', value: '#1c1c1c' },
  { name: 'Blau',    value: '#2f6fd0' },
  { name: 'Rot',     value: '#d0392f' },
  { name: 'Grün',    value: '#2f8a53' },
  { name: 'Orange',  value: '#e08324' }
];
const DRAW_WIDTHS = [1.5, 3, 6];          // dünn / mittel / dick
const DRAW_HOLD_MS = 600;                 // so lange still halten -> begradigen
const DRAW_HOLD_MOVE_PX = 4;              // "still" = weniger als das bewegt
const DRAW_SNAP_DEG = 7;                  // Einrasten auf 0/45/90/135 Grad
const DRAW_UNDO_LIMIT = 30;

const DRAW_PREF = {
  color: 'karteikarten-draw-color',
  width: 'karteikarten-draw-width',
  finger: 'karteikarten-draw-finger',
  straighten: 'karteikarten-draw-straighten',
  lockMode: 'karteikarten-draw-lock-mode',
  diag: 'karteikarten-diagnose'
};
function lsGet(key, def) {
  try { const v = localStorage.getItem(key); return v === null ? def : v; } catch (e) { return def; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* privater Modus */ }
}
function drawColorPref() {
  const c = lsGet(DRAW_PREF.color, DRAW_COLORS[0].value);
  return DRAW_COLORS.some(x => x.value === c) ? c : DRAW_COLORS[0].value;
}
function drawWidthPref() {
  const w = parseFloat(lsGet(DRAW_PREF.width, String(DRAW_WIDTHS[1])));
  return DRAW_WIDTHS.indexOf(w) !== -1 ? w : DRAW_WIDTHS[1];
}
function fingerDrawingEnabled() { return lsGet(DRAW_PREF.finger, '0') === '1'; }
function straightenEnabled() { return lsGet(DRAW_PREF.straighten, '1') === '1'; }

/* ---------- Zeichnen-Sperre ----------
   Nimmt der ganzen Seite die Touch-Gesten (siehe CSS html.draw-lock-mode).
   Nur so kann der Handballen, der neben der Zeichenfläche auf dem dunklen
   Untergrund liegt, keine Scroll-Geste mehr starten — die brach sonst den
   laufenden Stiftstrich ab. Gescrollt wird in diesem Modus gar nicht; zum
   Weiterlesen schaltet man die Sperre wieder aus. */
function drawLockMode() { return lsGet(DRAW_PREF.lockMode, '0') === '1'; }

function setDrawLockMode(on, hinweis) {
  lsSet(DRAW_PREF.lockMode, on ? '1' : '0');
  applyDrawLockMode();
  if (hinweis) showToast(hinweis);
}

function applyDrawLockMode() {
  const on = drawLockMode();
  const fab = document.getElementById('draw-lock-fab');
  // Wirksam wird die Sperre nur dort, wo auch der Knopf zum Abschalten steht
  // (Karten-Ansichten). Sonst säße man auf der Startseite mit einer Seite
  // fest, die sich nicht mehr scrollen lässt.
  document.documentElement.classList.toggle('draw-lock-mode', on && !!fab);
  if (fab) {
    fab.classList.toggle('active', on);
    fab.textContent = on ? '🔒' : '✋';
    fab.title = on ? 'Zeichnen-Sperre aus (wieder scrollen)' : 'Zeichnen-Sperre an (nur Stift, Handballen wird ignoriert)';
  }
  const sw = document.getElementById('switch-drawlock');
  if (sw) sw.classList.toggle('on', on);
  // Der Gesten-Riegel hängt an der Sperre (siehe wireDrawPointer)
  if (drawField && drawField.applyGestenRiegel) drawField.applyGestenRiegel();
}

/* ---------------------------------------------------------------------
   Leistungsanzeige (Diagnose)
   ---------------------------------------------------------------------
   Das Ruckeln beim Scrollen lässt sich nur auf dem iPad selbst beobachten —
   in der Browser-Automation am Rechner ist es nicht nachstellbar. Diese
   Anzeige macht es messbar: Bilder pro Sekunde, das längste Einzelbild und
   die Zahl der Aussetzer (Bilder über 24 ms) WÄHREND gescrollt wird. Dazu
   der aktuelle Eingabezustand, damit man sieht, ob z.B. der Handballen
   Striche abbricht.
   --------------------------------------------------------------------- */
const diagStats = { penDown: 0, penCancel: 0, touchDown: 0, touchCancel: 0 };
let diagRaf = 0;

function diagnosticsEnabled() { return lsGet(DRAW_PREF.diag, '0') === '1'; }

/* ---------- Ereignis-Mitschrift ----------
   Hält fest, welche Zeiger-Ereignisse tatsächlich ankommen und was die App
   damit gemacht hat. Nur so lässt sich klären, warum auf dem iPad ein Strich
   verschluckt wird — am Rechner tritt der Fall nicht auf. Über den Knopf 📋
   in der Anzeige wandert die Mitschrift in die Zwischenablage. */
const DIAG_LOG_MAX = 900;
const diagLog = [];
let diagT0 = 0;

function diagNote(text) {
  if (!diagnosticsEnabled()) return;
  const now = performance.now();
  if (!diagT0) diagT0 = now;
  diagLog.push(String(Math.round(now - diagT0)).padStart(6, ' ') + 'ms  ' + text);
  if (diagLog.length > DIAG_LOG_MAX) diagLog.shift();
}

/* ---------- Tintenzähler ----------
   Zählt, wie viele Bildpunkte der Zeichenfläche überhaupt gefärbt sind (auf
   160x120 heruntergerechnet, damit das Auslesen nicht bremst). Damit lässt
   sich die entscheidende Frage beantworten, die die erste Mitschrift offen
   ließ: Wenn ein Strich sauber ankommt und trotzdem fehlt, muss die Tinte
   nach dem Strich steigen und vor dem nächsten Strich wieder gefallen sein —
   dann löscht ihn etwas nachträglich. Bleibt die Tinte dagegen stehen, wurde
   nie gezeichnet. */
let diagInkCanvas = null;
function diagInk(f) {
  if (!diagnosticsEnabled()) return -1;
  if (!f || !f.canvas || !f.canvas.width || !f.canvas.height) return -1;
  try {
    if (!diagInkCanvas) {
      diagInkCanvas = document.createElement('canvas');
      diagInkCanvas.width = 160; diagInkCanvas.height = 120;
    }
    const g = diagInkCanvas.getContext('2d', { willReadFrequently: true });
    g.clearRect(0, 0, 160, 120);
    // Ohne Glättung fällt ein dünner Strich beim Herunterrechnen unter den
    // Tisch — er läge dann genau zwischen zwei abgetasteten Punkten.
    g.imageSmoothingEnabled = true;
    if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'high';
    g.drawImage(f.canvas, 0, 0, 160, 120);
    const d = g.getImageData(0, 0, 160, 120).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 8) n++;
    return n;
  } catch (e) { return -1; }
}

/* ---------- Seitenwacht ----------
   Die Mitschrift hing bisher an den Zuhörern der Zeichenfläche selbst. Fehlt
   dort ein Ereignis, sagt sie nicht, ob (a) WebKit gar nichts geschickt hat
   oder (b) das Ereignis an einem anderen Element gelandet ist. Diese Zuhörer
   sitzen am Dokument in der Einfangphase — sie laufen VOR denen der Fläche
   und sehen deshalb jedes Zeiger-Ereignis der ganzen Seite, samt Ziel.
   Zusätzlich die rohen Touch-Ereignisse: iPadOS meldet den Pencil auch dort
   (touchType 'stylus'). Kommt ein touchstart ohne zugehöriges pointerdown an,
   verschluckt die Pointer-Ebene von WebKit den Strich — das wäre der Beweis,
   und die Abhilfe sähe völlig anders aus. */
let diagWachtSteht = false;

function diagZiel(t) {
  if (!t || !t.tagName) return '?';
  const tag = t.tagName.toLowerCase();
  if (t.id) return tag + '#' + t.id;
  const cls = (typeof t.className === 'string') ? t.className.trim().split(/\s+/)[0] : '';
  return cls ? tag + '.' + cls : tag;
}

function diagWireSeitenwacht() {
  if (diagWachtSteht) return;
  diagWachtSteht = true;

  ['pointerdown', 'pointerup', 'pointercancel'].forEach(art => {
    document.addEventListener(art, (e) => {
      // pointermove bleibt außen vor — davon kommen hunderte je Strich.
      diagNote('  Seite ' + art.replace('pointer', '').toUpperCase().padEnd(6) +
        e.pointerType + ' #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) +
        ' auf ' + diagZiel(e.target));
    }, { capture: true, passive: true });
  });

  ['touchstart', 'touchend', 'touchcancel'].forEach(art => {
    document.addEventListener(art, (e) => {
      const t = e.changedTouches && e.changedTouches[0];
      diagNote('  Touch ' + art.replace('touch', '').toUpperCase().padEnd(6) +
        (t && t.touchType ? t.touchType : 'unbekannt') +
        ' (' + (e.touches ? e.touches.length : '?') + ' auf dem Glas)' +
        ' auf ' + diagZiel(e.target));
    }, { capture: true, passive: true });
  });

  // Schwebespur: iPadOS meldet den Pencil schon, bevor er aufsetzt. Wenn ein
  // Kontakt spurlos verschwindet, zeigt sie, ob der Stift überhaupt zum
  // dritten Strich heruntergefahren ist. Mitgeschrieben wird nur die halbe
  // Sekunde nach dem Abheben — genau das Fenster, in dem der verschluckte
  // Kontakt läge. Sonst liefe die Mitschrift mit Schwebepunkten voll.
  let letzteAbhebung = 0;
  let letzteSchwebe = 0;
  ['pointerover', 'pointerout'].forEach(art => {
    document.addEventListener(art, (e) => {
      if (e.pointerType !== 'pen') return;
      diagNote('  Schwebe ' + art.replace('pointer', '').toUpperCase().padEnd(5) +
        ' #' + e.pointerId + ' auf ' + diagZiel(e.target));
    }, { capture: true, passive: true });
  });
  ['pointerup', 'pointercancel'].forEach(art => {
    document.addEventListener(art, (e) => {
      if (e.pointerType === 'pen') letzteAbhebung = performance.now();
    }, { capture: true, passive: true });
  });
  document.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'pen') return;
    if (drawField && drawField.drawing) return;      // echter Strich, kein Schweben
    const now = performance.now();
    if (now - letzteAbhebung > 500 || now - letzteSchwebe < 100) return;
    letzteSchwebe = now;
    diagNote('  Schwebe bei ' + Math.round(e.clientX) + ',' + Math.round(e.clientY));
  }, { capture: true, passive: true });

  // Wohin sonst könnte ein verschluckter Kontakt geraten sein? Wenn WebKit ihn
  // als Tippgeste verbucht, taucht er hier als click/dblclick auf; als
  // Zoomgeste unter gesturestart.
  ['mousedown', 'mouseup', 'click', 'dblclick', 'contextmenu', 'selectstart',
   'gesturestart', 'gestureend'].forEach(art => {
    document.addEventListener(art, (e) => {
      diagNote('  Sonst  ' + art + ' auf ' + diagZiel(e.target));
    }, { capture: true, passive: true });
  });

  document.addEventListener('visibilitychange', () => {
    diagNote('  Seite ' + (document.hidden ? 'in den Hintergrund' : 'wieder im Vordergrund'));
  });
  window.addEventListener('resize', () => {
    diagNote('  Fenster neu vermessen ' + window.innerWidth + 'x' + window.innerHeight);
  }, { passive: true });
}

function diagLogText() {
  const c = drawField && drawField.canvas;
  return [
    'Karteikarten — Ereignis-Mitschrift',
    'Fassung vom ' + document.lastModified,
    'Sperre: ' + (drawLockMode() ? 'AN' : 'aus') +
      '   Flaeche: ' + (c ? getComputedStyle(c).touchAction : '—') +
      '   Finger-Zeichnen: ' + (fingerDrawingEnabled() ? 'an' : 'aus') +
      '   Gesten-Riegel: ' + (drawLockMode() ? 'AN' : 'aus'),
    'Stift ' + diagStats.penDown + ' (abgebrochen ' + diagStats.penCancel + ')' +
      '   Finger ' + diagStats.touchDown + ' (abgebrochen ' + diagStats.touchCancel + ')',
    '',
    ...diagLog
  ].join('\n');
}

/* Der Knopf „❗ Strich fehlte": setzt eine Marke in die Mitschrift, sobald ein
   Strich sichtbar gefehlt hat. Ohne sie lässt sich hinterher nicht sagen,
   welche Gruppe von Strichen der misslungene Buchstabe war — genau daran
   scheiterte die Auswertung der ersten Mitschrift. */
let diagMarkeNr = 0;
function diagMarke() {
  diagMarkeNr++;
  diagNote('=== MARKE ' + diagMarkeNr + ': hier fehlte ein Strich ===' +
    '  (Tinte jetzt ' + diagInk(drawField) + '; gemeint sind die Striche' +
    ' oberhalb dieser Zeile, ohne den Tipp auf den Knopf)');
  showToast('Marke ' + diagMarkeNr + ' gesetzt');
}

async function diagKopieren() {
  const text = diagLogText();
  try {
    await navigator.clipboard.writeText(text);
    showToast('Mitschrift kopiert — im Chat einfügen');
    return;
  } catch (e) { /* ohne Nutzergeste oder ohne Berechtigung */ }
  // Rückfallebene: zum Markieren anzeigen (Textfelder sind von user-select
  // ausgenommen, hier lässt sich also von Hand kopieren)
  showModal({
    title: 'Mitschrift',
    body: '<textarea readonly style="width:100%;height:40vh;font:11px/1.4 ui-monospace,Menlo,monospace">'
      + escapeHtml(text) + '</textarea>',
    actions: [{ label: 'Fertig', class: 'primary' }]
  });
}

function applyDiagnostics() {
  const on = diagnosticsEnabled();
  let hud = document.getElementById('diag-hud');
  if (!on) {
    if (diagRaf) { cancelAnimationFrame(diagRaf); diagRaf = 0; }
    if (hud) hud.remove();
    return;
  }
  if (!hud) {
    hud = document.createElement('div');
    hud.id = 'diag-hud';
    hud.innerHTML = '<div id="diag-text"></div>'
      + '<button id="diag-mark" type="button">❗ Strich fehlte</button>'
      + '<button id="diag-copy" type="button">📋 Mitschrift kopieren</button>';
    document.body.appendChild(hud);
