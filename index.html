    hud.querySelector('#diag-copy').addEventListener('click', diagKopieren);
    hud.querySelector('#diag-mark').addEventListener('click', diagMarke);
  }
  diagWireSeitenwacht();
  if (diagRaf) return;

  let lastScroll = 0;
  window.addEventListener('scroll', () => { lastScroll = performance.now(); }, { passive: true });

  let prev = performance.now();
  let frames = 0, sumDt = 0, worst = 0, jank = 0, scrollFrames = 0;
  let letzteAusgabe = prev;

  const tick = (now) => {
    const dt = now - prev;
    prev = now;
    // „Scrollt gerade" = im letzten Bild kam ein Scroll-Ereignis
    const beimScrollen = (now - lastScroll) < 150;
    frames++; sumDt += dt;
    if (beimScrollen) {
      scrollFrames++;
      if (dt > worst) worst = dt;
      if (dt > 24) jank++;          // ~1,5 Bilder bei 60 Hz = spürbarer Ruckler
    }
    if (now - letzteAusgabe > 500) {
      const fps = sumDt > 0 ? Math.round(1000 * frames / sumDt) : 0;
      const c = drawField && drawField.canvas;
      const ta = c ? getComputedStyle(c).touchAction : '—';
      const feld = hud.querySelector('#diag-text');
      if (feld) feld.textContent =
        'FPS ' + fps + '   laengstes Bild ' + Math.round(worst) + ' ms\n' +
        'Ruckler beim Scrollen: ' + jank + ' / ' + scrollFrames + ' Bilder\n' +
        'Sperre ' + (drawLockMode() ? 'AN' : 'aus') + '   Flaeche: ' + ta + '\n' +
        'Stift ' + diagStats.penDown + ' (abgebrochen ' + diagStats.penCancel + ')' +
        '   Finger ' + diagStats.touchDown + ' (' + diagStats.touchCancel + ')\n' +
        diagLog.slice(-9).join('\n');
      frames = 0; sumDt = 0;
      letzteAusgabe = now;
    }
    diagRaf = requestAnimationFrame(tick);
  };
  diagRaf = requestAnimationFrame(tick);
}

/* ---------- Erkennung: Ist das eine Zeichenkarte? ---------- */

function cardFrontHtml(card) {
  return card.mcData ? (card.mcData.frage || '') : (card.front || '');
}
function cardBackHtml(card) {
  return card.mcData ? (card.mcData.richtigText || '') : (card.back || '');
}
// HTML -> Klartext (Entities aufgelöst, Leerraum normalisiert)
function htmlToPlainText(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}

function detectDrawing(card) {
  const html = cardFrontHtml(card);
  // 1. Platzhalter im Kartentext
  const m = DRAW_MARKER_RE.exec(html);
  if (m) return { on: true, reason: 'marker', template: (m[1] || '').trim() || null };
  // 2. Anki-Tag
  const tags = String(card.tags || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (tags.indexOf(DRAW_TAG) !== -1) return { on: true, reason: 'tag', template: null };
  // 3. Texterkennung als Rückfallebene
  const text = htmlToPlainText(html);
  if (text && DRAW_TEXT_PATTERNS.some(re => re.test(text))) {
    return { on: true, reason: 'text', template: null };
  }
  // 4. "gegeben"-Block mit Tabelle/Zeichnung bzw. Tabelle mit Leerfeldern:
  //    Solche Karten füllt man aus — dafür ist das Zeichenfeld da.
  const holder = document.createElement('div');
  holder.innerHTML = stripDrawMarker(html || '');
  if (findGivenTemplate(holder, true)) return { on: true, reason: 'gegeben', template: null };
  return { on: false, reason: null, template: null };
}

/* ---------- Vorlage aus der Karte selbst ----------
   Viele Prüfungskarten zeigen unter der Überschrift "gegeben" eine leere
   Tabelle oder eine Skizze, in die die Antwort einzutragen ist. Genau dieses
   Element wandert als Vorlage in die Zeichenfläche — nachbauen muss man dort
   also nichts mehr, man schreibt direkt hinein. */

const GIVEN_LABEL_RE = /^(gegeben|geg\.?|vorgabe|vorlage|ausfüllen|auszufüllen)\s*:?$/i;

// Elemente des Kartentextes — die Ebenen des Zeichenfelds selbst liegen mit im
// Kartentext und dürfen nie als Vorlage dienen.
function outsideStack(list) {
  return Array.from(list).filter(el => !el.closest('.draw-stack'));
}

function givenLabelIn(root) {
  const els = root.querySelectorAll('div,p,span,b,strong,em,i,h1,h2,h3,h4,h5,h6,label,caption,legend,td,th');
  for (const el of els) {
    if (el.closest('.draw-stack')) continue;
    if (el.querySelector('table,svg,img')) continue;   // Beschriftung enthält nie die Vorlage
    const t = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (GIVEN_LABEL_RE.test(t)) return el;
  }
  return null;
}

// Leere Zellen = auszufüllende Felder.
function blankCellCount(table) {
  let n = 0;
  for (const c of table.querySelectorAll('td,th')) {
    const t = (c.textContent || '').replace(/\u00a0/g, ' ').trim();
    if (!t) n++;
  }
  return n;
}

// Liefert { el, label } — das Vorlagenelement und (falls vorhanden) seine
// "gegeben"-Beschriftung, die zusammen mit ihm im Text ausgeblendet wird.
// strict=true: nur eindeutige Ausfüll-Vorlagen (für die automatische Erkennung).
function findGivenTemplate(root, strict) {
  if (!root) return null;

  // 1. ausdrücklich ausgezeichnet
  const marked = outsideStack(root.querySelectorAll('[data-vorlage],[data-given]'))[0];
  if (marked) return { el: marked, label: null };

  // 2. Element direkt nach einer "gegeben"-Beschriftung
  const label = givenLabelIn(root);
  if (label) {
    const cands = outsideStack(root.querySelectorAll('table,svg,img'));
    for (const el of cands) {
      if (label.contains(el)) continue;
      if (label.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) {
        return { el, label };
      }
    }
  }

  // 3. Tabelle mit mehreren Leerfeldern — die ist unverkennbar zum Ausfüllen da
  const tables = outsideStack(root.querySelectorAll('table'));
  const blanks = tables.filter(t => blankCellCount(t) >= 3);
  if (blanks.length === 1) return { el: blanks[0], label: null };

  if (strict) return null;

  // 4. Ohne Automatik (Stift-Knopf von Hand): genau eine Tabelle bzw. Zeichnung
  if (tables.length === 1) return { el: tables[0], label: null };
  const svgs = outsideStack(root.querySelectorAll('svg'));
  if (!tables.length && svgs.length === 1) return { el: svgs[0], label: null };
  return null;
}

// Ersetzt den Platzhalter durch den Ankerpunkt für das Zeichenfeld. Steht kein
// Platzhalter im Text, kommt der Anker ans Ende — dann greift auch der manuelle
// Stift-Knopf auf jeder beliebigen Karte.
function withDrawAnchor(frontHtml) {
  if (DRAW_MARKER_RE.test(frontHtml)) {
    return frontHtml.replace(DRAW_MARKER_RE, '<div id="draw-anchor"></div>');
  }
  return frontHtml + '<div id="draw-anchor"></div>';
}
// Auf der Rückseite (die per {{FrontSide}} oft die Frage enthält) hat der
// Platzhalter nichts verloren.
function stripDrawMarker(html) {
  return (html || '').replace(DRAW_MARKER_RE_G, '');
}

/* ---------- Zustand ---------- */

let drawField = null;          // aktives Zeichenfeld oder null
let drawManualToggle = null;   // { cardId, on } — manuelle Übersteuerung je Karte

/* ---------- Aufbau / Abbau ---------- */

function destroyDrawField() {
  if (drawField) {
    clearTimeout(drawField.holdTimer);
    clearTimeout(drawField.flashTimer);
    window.removeEventListener('resize', drawField.onResize);
    window.removeEventListener('orientationchange', drawField.onResize);
    if (drawField.domObserver) drawField.domObserver.disconnect();
    // Läuft gerade eine Finger-Scrollgeste, hängen deren Zuhörer am window
    if (drawField.stopPan) drawField.stopPan();
    drawField = null;
  }
  const fab = document.getElementById('draw-pen-fab');
  if (fab) fab.remove();
  const lockFab = document.getElementById('draw-lock-fab');
  if (lockFab) lockFab.remove();
  applyDrawLockMode();          // ohne Knopf keine Sperre (siehe dort)
  updateFabDodge();             // ohne Knopf auch keine Ausweich-Höhe
  const block = document.getElementById('draw-block');
  if (block) block.remove();
  // Bild bzw. Tabelle, das als Vorlage ins Canvas gewandert war, wieder im
  // Kartentext zeigen
  document.querySelectorAll('[data-draw-template]').forEach(el => el.removeAttribute('data-draw-template'));
}

// Wird am Ende jeder Kartenansicht aufgerufen. Ohne Zeichenkarte passiert außer
// dem Stift-Knopf nichts — normale Karten verhalten sich exakt wie vorher.
function setupDrawingForCard(card) {
  destroyDrawField();
  if (!card) return;
  const det = detectDrawing(card);
  let on = det.on;
  if (drawManualToggle && drawManualToggle.cardId === card.id) on = drawManualToggle.on;

  addDrawPenFab(card, on);
  if (!on) return;
  buildDrawField(card, det);
}

function addDrawPenFab(card, on) {
  const main = document.querySelector('main');
  if (!main) return;
  const btn = document.createElement('button');
  btn.id = 'draw-pen-fab';
  btn.className = 'draw-pen-fab' + (on ? ' active' : '');
  btn.title = on ? 'Zeichenfeld ausblenden' : 'Zeichenfeld einblenden';
  btn.textContent = '✏️';
  btn.addEventListener('click', () => {
    drawManualToggle = { cardId: card.id, on: !on };
    setupDrawingForCard(card);
    // Beim Einblenden auf der Rückseite muss das Feld dorthin, wo man es sieht.
    const backWrap = document.getElementById('card-back-wrap');
    updateDrawForFace(!!backWrap && backWrap.style.display === 'block');
  });
  main.appendChild(btn);

  // Zeichnen-Sperre direkt darüber — sie wird beim Schreiben gebraucht, also
  // muss sie ohne Umweg über die Einstellungen erreichbar sein.
  const lock = document.createElement('button');
  lock.id = 'draw-lock-fab';
  lock.className = 'draw-pen-fab draw-lock-fab';
  lock.addEventListener('click', () => {
    const an = !drawLockMode();
    setDrawLockMode(an, an
      ? '✋ Zeichnen-Sperre an — nur der Stift zeichnet, Scrollen ist aus'
      : 'Zeichnen-Sperre aus — Scrollen geht wieder');
  });
  main.appendChild(lock);
  applyDrawLockMode();
  updateFabDodge();
}

/* ---------------------------------------------------------------------
   Ausweichen vor den Knopfreihen (iPhone)
   Auf dem iPad ist die Kartenspalte auf 720px begrenzt und daneben bleibt
   genug Rand für die runden Knöpfe. Auf dem iPhone reicht die Spalte bis an
   den Rand — dort deckten Stift- und Sperr-Knopf die rechte Taste ("Leicht")
   zu und man traf sie nicht mehr. Deshalb wird hier gemessen: Überschneidet
   sich eine Knopfreihe mit dem Knopfstapel, wandert der Stapel darüber.
   Rein rechnerisch — auf breiten Geräten kommt dabei die alte Lage heraus.
   --------------------------------------------------------------------- */
const FAB_SIZE = 54;      // Durchmesser eines runden Knopfs
const FAB_EDGE = 16;      // Grundabstand zum unteren Rand
const FAB_GAP  = 64;      // Versatz Stift-Knopf -> Sperr-Knopf (siehe CSS)
// Reihen, die frei bleiben müssen: Bewertung beim Lernen, Blättern/Löschen beim Durchsehen
const FAB_DODGE_ROWS = '#answer-buttons, .browse-nav, .browse-delete-btn';

function updateFabDodge() {
  const root = document.documentElement;
  if (!document.getElementById('draw-pen-fab')) { root.style.removeProperty('--fab-bottom'); return; }

  // clientWidth/clientHeight statt innerWidth/innerHeight: Das ist genau der
  // Bereich, auf den sich "position: fixed" bezieht — ein Scrollbalken am
  // Rechner zählt hier nicht mit und die Knöpfe wurden sonst zu weit rechts
  // vermutet.
  const vh = root.clientHeight || window.innerHeight;
  const vw = root.clientWidth || window.innerWidth;
  const fabLeft   = vw - FAB_EDGE - FAB_SIZE;                      // linke Kante des Stapels
  const stackTop  = vh - (FAB_EDGE + FAB_GAP + FAB_SIZE);          // Oberkante Sperr-Knopf
  const stackBot  = vh - FAB_EDGE;

  let rowTop = Infinity;
  document.querySelectorAll(FAB_DODGE_ROWS).forEach(row => {
    if (row.offsetParent === null) return;                          // ausgeblendet (z.B. Vorderseite)
    const r = row.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    if (r.right <= fabLeft) return;                                 // links vorbei — kein Konflikt (iPad)
    if (r.bottom <= stackTop || r.top >= stackBot) return;          // ober-/unterhalb — kein Konflikt
    if (r.top < rowTop) rowTop = r.top;
  });

  let bottom = FAB_EDGE;
  if (rowTop < Infinity) {
    bottom = Math.round(vh - rowTop + 12);                          // Stift-Knopf über die Reihe heben
    // nicht so weit, dass der Sperr-Knopf oben aus dem Bild wandert
    const max = Math.max(FAB_EDGE, vh - FAB_GAP - FAB_SIZE - 8);
    if (bottom > max) bottom = max;
  }
  root.style.setProperty('--fab-bottom', bottom + 'px');
}

// Beim Scrollen und Drehen neu messen (billig: ein paar getBoundingClientRect)
window.addEventListener('scroll', updateFabDodge, { passive: true });
window.addEventListener('resize', updateFabDodge);
window.addEventListener('orientationchange', updateFabDodge);

function buildDrawField(card, det) {
  const anchor = document.getElementById('draw-anchor');
  if (!anchor) return;

  const color = drawColorPref();
  const width = drawWidthPref();

  const colorsHtml = DRAW_COLORS.map(c =>
    `<button class="draw-btn draw-color${c.value === color ? ' active' : ''}" data-color="${c.value}" title="${c.name}" aria-label="${c.name}"><span class="dot" style="background:${c.value}"></span></button>`
  ).join('');
  const sizesHtml = DRAW_WIDTHS.map((w, i) => {
    const px = 7 + i * 5;
    return `<button class="draw-btn draw-size${w === width ? ' active' : ''}" data-width="${w}" title="Linienstärke ${['dünn','mittel','dick'][i]}"><span class="dot" style="width:${px}px;height:${px}px"></span></button>`;
  }).join('');

  const block = document.createElement('div');
  block.className = 'draw-block';
  block.id = 'draw-block';
  block.innerHTML = `
    <div class="draw-toolbar">
      ${colorsHtml}
      <span class="sep"></span>
      ${sizesHtml}
      <span class="sep"></span>
      <button class="draw-btn" id="draw-eraser" title="Radierer">🧽</button>
      <button class="draw-btn" id="draw-undo" title="Rückgängig" disabled>↺</button>
      <button class="draw-btn" id="draw-redo" title="Wiederherstellen" disabled>↻</button>
      <button class="draw-btn danger" id="draw-clear" title="Alles löschen">🗑</button>
    </div>
    <div class="draw-stack" id="draw-stack">
      <img class="draw-layer draw-template" id="draw-template" alt="">
      <div class="draw-dom-layer draw-template-dom" id="draw-template-dom" aria-hidden="true"><div class="draw-dom-inner" id="draw-template-inner"></div></div>
      <img class="draw-layer draw-prev" id="draw-prev" alt="">
      <canvas class="draw-canvas" id="draw-canvas"></canvas>
      <img class="draw-layer draw-solution" id="draw-solution" alt="">
      <div class="draw-dom-layer draw-solution-dom" id="draw-solution-dom" aria-hidden="true"><div class="draw-dom-inner" id="draw-solution-inner"></div></div>
    </div>
    <div class="draw-actions">
      <button class="draw-solve-btn" id="draw-solve">Lösung zeigen</button>
      <button class="draw-mini-btn" id="draw-keep">💾 Skizze behalten</button>
      <button class="draw-mini-btn" id="draw-prev-toggle" style="display:none">👁 letzte Skizze einblenden</button>
    </div>
    <div class="draw-overlay-row" id="draw-overlay-row" style="display:none">
      <button class="draw-mini-btn" id="draw-overlay-toggle">🔍 Überblenden</button>
      <input type="range" id="draw-overlay-opacity" min="10" max="100" value="50" title="Transparenz der Überblendung">
    </div>
    <div class="draw-hint">Mit dem Apple Pencil zeichnen. Am Ende eines Strichs kurz gedrückt halten — die Form wird begradigt.<br>Mit dem Finger auf der Fläche scrollen, Doppeltipp dreht die Karte um.<br>Bricht der Handballen Striche ab: ✋ unten rechts sperrt alle Finger-Gesten.</div>
  `;
  anchor.appendChild(block);

  // Klicks im Zeichenfeld dürfen nicht bis zum Karten-Handler durchschlagen —
  // sonst zählt derselbe Doppeltipp doppelt. Auf der Zeichenfläche selbst
  // übernimmt wireDrawPointer die Doppeltipp-Erkennung (nur mit dem Finger).
  block.addEventListener('click', (e) => e.stopPropagation());

  const canvas = block.querySelector('#draw-canvas');
  const f = {
    card, canvas, ctx: null, dpr: 1, cssW: 0, cssH: 0,
    color, width,
    eraser: false,
    drawing: false, activeId: null, strokeStart: null,
    points: [], base: null, recognized: null,
    shapeDrag: false, shapeStart: null,
    holdAnchor: null, holdAnchorIndex: 0, holdTimer: null, flashTimer: null,
    undo: [], redo: [],
    overlayOn: false,
    templateDom: null, solutionDom: null, givenEl: null, hasSolution: false,
    onResize: null
  };
  drawField = f;

  f.onResize = () => { fitDrawCanvas(f); fitDrawDomLayers(f); };
  window.addEventListener('resize', f.onResize);
  window.addEventListener('orientationchange', f.onResize);
  requestAnimationFrame(() => { if (drawField === f) f.onResize(); });

  wireDrawToolbar(f, block);
  wireDrawPointer(f);
  setupDrawLayers(f, det);
  loadStoredSketch(f);

  // Auf Zeichenkarten übernimmt der Knopf das Aufdecken.
  const hint = document.getElementById('tap-hint');
  if (hint) hint.textContent = 'Doppeltipp mit dem Finger dreht die Karte um — auch auf der Zeichenfläche';
}

// Bildvorlage und Lösungsbild bestimmen.
function setupDrawLayers(f, det) {
  const frontEl = document.getElementById('card-front');
  const tplImg = document.getElementById('draw-template');
  let src = null;
  let givenEl = null;

  if (det.template) {
    src = resolveTemplateSrc(det.template, frontEl);
  } else if (frontEl) {
    // Genau ein Bild auf der Vorderseite -> das ist die Vorlage.
    const imgs = cardImagesIn(frontEl);
    if (imgs.length === 1) {
      src = imgs[0].getAttribute('src');
      imgs[0].setAttribute('data-draw-template', '');  // im Text ausblenden
    } else {
      // Kein Bild: "gegeben"-Tabelle bzw. -Zeichnung der Karte übernehmen.
      const found = findGivenTemplate(frontEl, false);
      if (found) {
        if (found.el.tagName === 'IMG') {
          src = found.el.getAttribute('src');
          found.el.setAttribute('data-draw-template', '');
        } else {
          givenEl = found.el;
          useDomTemplate(f, found);
        }
      }
    }
  }
  f.templateSrc = src || null;
  f.givenEl = givenEl;
  if (src && tplImg) {
    tplImg.addEventListener('error', () => { tplImg.style.display = 'none'; });
    tplImg.src = src;
  }

  // Lösungsbild für die Überblendung: erstes Bild der Rückseite, das nicht die
  // Vorlage selbst ist (die Rückseite enthält per {{FrontSide}} oft die Frage).
  const solImg = document.getElementById('draw-solution');
  const backHtml = cardBackHtml(f.card) || (f.card.mcData ? f.card.mcData.erklaerung : '');
  const holder = document.createElement('div');
  holder.innerHTML = stripDrawMarker(backHtml || '');
  for (const img of holder.querySelectorAll('img')) {
    const s = img.getAttribute('src');
    if (!s || s === f.templateSrc) continue;
    f.solutionSrc = s;
    if (solImg) solImg.src = s;
    break;
  }
  // Ohne Lösungsbild: die ausgefüllte Tabelle/Zeichnung der Rückseite nehmen.
  if (!f.solutionSrc && f.givenEl) useDomSolution(f, holder);

  f.hasSolution = !!(f.solutionSrc || f.solutionDom);
  if (f.templateDom) fitDrawDomLayers(f);
}

/* ---------- Vorlage aus der Karte in die Zeichenfläche legen ---------- */

// Legt das gefundene Element als Hintergrund ins Zeichenfeld und blendet es
// (samt "gegeben"-Beschriftung) im Kartentext aus — sonst stünde dasselbe
// zweimal untereinander.
function useDomTemplate(f, found) {
  const inner = document.getElementById('draw-template-inner');
  if (!inner) return;
  const clone = cloneForTemplate(found.el);
  inner.innerHTML = '';
  inner.appendChild(clone);
  f.templateDom = clone;
  f.givenHtml = found.el.outerHTML;   // vor dem Markieren, für den Abgleich mit der Rückseite
  found.el.setAttribute('data-draw-template', '');
  if (found.label) found.label.setAttribute('data-draw-template', '');

  const hint = document.querySelector('#draw-block .draw-hint');
  if (hint) {
    const was = clone.tagName === 'TABLE' ? 'Tabelle' : 'Zeichnung';
    hint.innerHTML = '<b>Die ' + was + ' der Karte liegt schon im Feld — direkt hineinschreiben.</b><br>' + hint.innerHTML;
  }

  // Sofort einpassen — und danach noch einmal, sobald sich die Größe ändert:
  // MathJax setzt Formeln in der Vorlage erst später, und beim Umdrehen der
  // Karte wechselt das Feld in eine andere Spalte.
  fitDrawDomLayers(f);
  if (window.ResizeObserver) {
    f.domObserver = new ResizeObserver(() => { if (drawField === f) fitDrawDomLayers(f); });
    const stack = document.getElementById('draw-stack');
    if (stack) f.domObserver.observe(stack);
    f.domObserver.observe(inner);
  }
}

// Kopie fürs Zeichenfeld: leere Zellen bekommen Platz, damit man mit dem Stift
// hineinschreiben kann. Die Vorlage in der Karte selbst bleibt unverändert.
function cloneForTemplate(el) {
  const clone = el.cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  if (clone.tagName === 'TABLE') {
    for (const c of clone.querySelectorAll('td,th')) {
      const t = (c.textContent || '').replace(/\u00a0/g, ' ').trim();
      if (t) {
        c.style.whiteSpace = 'nowrap';
      } else {
        c.style.minWidth = '104px';
        c.style.height = '46px';
      }
    }
  } else if (clone.tagName.toLowerCase() === 'svg') {
    // Skizzen skalieren über die Zeichenfläche, nicht über feste Pixelmaße.
    clone.removeAttribute('width');
    clone.removeAttribute('height');
    const box = clone.getAttribute('viewBox');
    if (box) {
      const n = box.split(/[\s,]+/).map(parseFloat);
      if (n.length === 4 && n[2] > 0 && n[3] > 0) {
        clone.style.width = n[2] + 'px';
        clone.style.height = n[3] + 'px';
      }
    }
  }
  return clone;
}

// Lösung für die Überblendung. Passt die Tabelle der Rückseite in Zeilen und
// Spalten zur Vorlage, werden ihre Texte in die Geometrie der VORLAGE gesetzt —
// dann liegt die Lösung beim Überblenden zellengenau über der eigenen Schrift.
function useDomSolution(f, backRoot) {
  const inner = document.getElementById('draw-solution-inner');
  if (!inner || !f.templateDom) return;
  const tpl = f.templateDom;
  const isTable = tpl.tagName === 'TABLE';
  const own = f.givenHtml || '';

  let sol = null;
  const cands = Array.from(backRoot.querySelectorAll(isTable ? 'table' : 'svg'))
    .filter(el => el.outerHTML !== own);
  if (isTable) {
    // Die ausgefüllte Fassung ist die mit den wenigsten Leerfeldern.
    cands.sort((a, b) => blankCellCount(a) - blankCellCount(b));
    sol = cands[0] || null;
    if (sol && blankCellCount(sol) >= blankCellCount(f.givenEl)) sol = null;
  } else {
    sol = cands[cands.length - 1] || null;
  }
  if (!sol) return;

  const merged = isTable ? mergeSolutionIntoTemplate(tpl, sol) : cloneForTemplate(sol);
  inner.innerHTML = '';
  inner.appendChild(merged);
  f.solutionDom = merged;
}

// Zellen der Vorlage mit den Texten der Lösungstabelle füllen. Passt die Form
// nicht zusammen, wird die Lösungstabelle unverändert übernommen.
function mergeSolutionIntoTemplate(tplTable, solTable) {
  const tplRows = Array.from(tplTable.rows);
  const solRows = Array.from(solTable.rows);
  const sameShape = tplRows.length === solRows.length &&
    tplRows.every((r, i) => r.cells.length === solRows[i].cells.length);
  if (!sameShape) {
    const plain = cloneForTemplate(solTable);
    plain.querySelectorAll('td,th').forEach(c => { c.style.whiteSpace = ''; });
    return plain;
  }
  const merged = cloneForTemplate(tplTable);
  const mRows = Array.from(merged.rows);
  mRows.forEach((row, i) => {
    Array.from(row.cells).forEach((cell, j) => {
      const wasBlank = !(cell.textContent || '').replace(/\u00a0/g, ' ').trim();
      if (!wasBlank) return;
      const solCell = solRows[i].cells[j];
      cell.innerHTML = solCell ? solCell.innerHTML : '';
      cell.classList.add('draw-sol-fill');
      cell.style.whiteSpace = 'normal';
      cell.style.fontSize = '12px';
      cell.style.lineHeight = '1.25';
      cell.style.padding = '2px 4px';
      cell.style.verticalAlign = 'middle';
    });
  });
  return merged;
}

// Vorlage und Lösung mittig einpassen: so groß wie möglich, aber vollständig
// sichtbar. Beide bekommen denselben Maßstab und dieselben Zellmaße — nur so
// liegt die Lösung beim Überblenden genau auf der eigenen Schrift.
function fitDrawDomLayers(f) {
  const stack = document.getElementById('draw-stack');
  const tplInner = document.getElementById('draw-template-inner');
  const solInner = document.getElementById('draw-solution-inner');
  if (!stack || !tplInner || !tplInner.firstElementChild) return;
  const box = stack.getBoundingClientRect();
  if (!box.width || !box.height) return;
  const pad = 10;

  const inners = [tplInner, solInner].filter(el => el && el.firstElementChild);
  inners.forEach(el => { el.style.transform = 'translate(-50%, -50%)'; });

  if (f.solutionDom && f.templateDom && f.templateDom.tagName === 'TABLE'
      && f.solutionDom.tagName === 'TABLE') {
    copyTableGeometry(f.templateDom, f.solutionDom);
  }

  const r = tplInner.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const raw = Math.min((box.width - 2 * pad) / r.width, (box.height - 2 * pad) / r.height);
  const scale = Math.max(.15, Math.min(4, raw));
  inners.forEach(el => { el.style.transform = 'translate(-50%, -50%) scale(' + scale + ')'; });
  f.domScale = scale;
}

// Spaltenbreiten und Zeilenhöhen der Vorlage auf die Lösungstabelle übertragen.
function copyTableGeometry(tpl, sol) {
  const tRows = Array.from(tpl.rows);
  const sRows = Array.from(sol.rows);
  if (!tRows.length || tRows.length !== sRows.length) return;
  const first = tRows[0];
  sol.style.tableLayout = 'fixed';
  sol.style.width = tpl.getBoundingClientRect().width + 'px';
  tRows.forEach((row, i) => {
    const h = row.getBoundingClientRect().height;
    if (h) sRows[i].style.height = h + 'px';
    if (row !== first) return;
    Array.from(row.cells).forEach((cell, j) => {
      const w = cell.getBoundingClientRect().width;
      const target = sRows[i].cells[j];
      if (!w || !target) return;
      // Gemessen wird die Außenkante — also muss die Zelle auch so rechnen.
      target.style.boxSizing = 'border-box';
      target.style.width = w + 'px';
    });
  });
  // Zweiter Durchgang: Rahmen und Zellabstände verschieben die Spalten noch um
  // ein paar Pixel — Restabweichung messen und ausgleichen.
  Array.from(first.cells).forEach((cell, j) => {
    const target = sRows[0].cells[j];
    if (!target || !target.style.width) return;
    const want = cell.getBoundingClientRect().width;
    const got = target.getBoundingClientRect().width;
    if (want && got) target.style.width = (parseFloat(target.style.width) + (want - got)) + 'px';
  });
  sol.style.width = tpl.getBoundingClientRect().width + 'px';
}

// Bilder des Kartentextes — die Ebenen des Zeichenfelds selbst liegen ebenfalls
// innerhalb von #card-front (der Anker steht ja mitten im Text) und dürfen hier
// nicht mitgezählt werden.
function cardImagesIn(root) {
  return Array.from(root.querySelectorAll('img')).filter(img => !img.closest('.draw-stack'));
}

function resolveTemplateSrc(spec, frontEl) {
  if (!spec) return null;
  if (/^(blob:|data:|https?:|\.|\/)/i.test(spec)) return spec;
  // Nur ein Dateiname: passendes <img> auf der Karte suchen
  if (frontEl) {
    const imgs = cardImagesIn(frontEl);
    for (const img of imgs) {
      const s = img.getAttribute('src') || '';
      if (s === spec || s.endsWith('/' + spec) || s.endsWith(spec)) {
        img.setAttribute('data-draw-template', '');
        return s;
      }
    }
  }
  return spec; // relativer Pfad — kann klappen, sonst greift onerror
}

/* ---------- Canvas in Geräteauflösung ---------- */

function fitDrawCanvas(f) {
  const rect = f.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (f.canvas.width === w && f.canvas.height === h) return;

  diagNote('FIT   Zeichenflaeche neu ' + w + 'x' + h +
    ' (vorher ' + f.canvas.width + 'x' + f.canvas.height + ')');
  // Vorhandene Zeichnung beim Größenwechsel (z.B. Drehen des iPads) mitnehmen
  let old = null;
  if (f.canvas.width && f.canvas.height) {
    old = document.createElement('canvas');
    old.width = f.canvas.width; old.height = f.canvas.height;
    old.getContext('2d').drawImage(f.canvas, 0, 0);
  }
  f.canvas.width = w;
  f.canvas.height = h;
  const ctx = f.canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // ab jetzt in CSS-Pixeln rechnen
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (old) ctx.drawImage(old, 0, 0, rect.width, rect.height);
  f.ctx = ctx; f.dpr = dpr; f.cssW = rect.width; f.cssH = rect.height;
}

/* ---------- Werkzeugleiste ---------- */

function wireDrawToolbar(f, block) {
  block.querySelectorAll('[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      f.color = btn.dataset.color;
      lsSet(DRAW_PREF.color, f.color);
      block.querySelectorAll('[data-color]').forEach(b => b.classList.toggle('active', b === btn));
      setEraser(f, false);
    });
  });
  block.querySelectorAll('[data-width]').forEach(btn => {
    btn.addEventListener('click', () => {
      f.width = parseFloat(btn.dataset.width);
      lsSet(DRAW_PREF.width, String(f.width));
      block.querySelectorAll('[data-width]').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
  block.querySelector('#draw-eraser').addEventListener('click', () => setEraser(f, !f.eraser));
  block.querySelector('#draw-undo').addEventListener('click', () => drawUndo(f));
  block.querySelector('#draw-redo').addEventListener('click', () => drawRedo(f));
  block.querySelector('#draw-clear').addEventListener('click', () => confirmDrawClear(f));

  block.querySelector('#draw-solve').addEventListener('click', () => toggleCardFace());
  block.querySelector('#draw-keep').addEventListener('click', () => keepSketch(f));
  block.querySelector('#draw-prev-toggle').addEventListener('click', () => togglePrevSketch(f));

  block.querySelector('#draw-overlay-toggle').addEventListener('click', () => toggleSolutionOverlay(f));
  block.querySelector('#draw-overlay-opacity').addEventListener('input', (e) => {
    const v = String(parseInt(e.target.value, 10) / 100);
    const sol = document.getElementById('draw-solution');
    const solDom = document.getElementById('draw-solution-dom');
    if (sol) sol.style.opacity = v;
    if (solDom) solDom.style.opacity = v;
  });
}

function setEraser(f, on) {
  f.eraser = on;
  const btn = document.getElementById('draw-eraser');
  if (btn) btn.classList.toggle('eraser-on', on);
}

function updateUndoButtons(f) {
  const u = document.getElementById('draw-undo');
  const r = document.getElementById('draw-redo');
  if (u) u.disabled = f.undo.length === 0;
  if (r) r.disabled = f.redo.length === 0;
}

function confirmDrawClear(f) {
  showModal({
    title: 'Zeichnung löschen?',
    body: 'Die aktuelle Zeichnung wird vollständig entfernt. Die Vorlage bleibt erhalten.',
    actions: [
      { label: 'Abbrechen', class: 'secondary' },
      { label: 'Ja, löschen', class: 'primary', onClick: () => {
          pushUndoState(f, snapshotDataUrl(f));
          clearDrawCanvas(f);
          closeModal();
        } }
    ]
  });
}

function clearDrawCanvas(f) {
  const ctx = f.ctx; if (!ctx) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, f.canvas.width, f.canvas.height);
  ctx.restore();
}

/* ---------- Rückgängig / Wiederherstellen (strichweise) ---------- */

function snapshotDataUrl(f) {
  try { return f.canvas.toDataURL('image/png'); } catch (e) { return null; }
}
// Der Zustand VOR dem Strich wandert als PNG in den Rückgängig-Stapel. Das
// Kodieren kostet auf dem iPad zweistellige Millisekunden — direkt beim
// Abheben des Stifts blockiert es genau die Lücke, in der man beim schnellen
// Schreiben schon wieder aufsetzt. Deshalb erst im nächsten freien Moment.
// Die Reihenfolge bleibt erhalten, weil alle Aufträge dieselbe Warteschlange
// benutzen.
function queueUndoSnapshot(f, baseCanvas) {
  if (!baseCanvas) return;
  setTimeout(() => {
    if (drawField !== f) return;
    try { pushUndoState(f, baseCanvas.toDataURL('image/png')); } catch (e) { /* egal */ }
  }, 0);
}
function pushUndoState(f, dataUrl) {
  if (!dataUrl) return;
  f.undo.push(dataUrl);
  if (f.undo.length > DRAW_UNDO_LIMIT) f.undo.shift();
  f.redo.length = 0;
  updateUndoButtons(f);
}
function restoreDataUrl(f, dataUrl) {
  if (!dataUrl) { clearDrawCanvas(f); return; }
  const img = new Image();
  img.onload = () => {
    if (drawField !== f) return;
    const ctx = f.ctx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, f.canvas.width, f.canvas.height);
    ctx.drawImage(img, 0, 0, f.canvas.width, f.canvas.height);
    ctx.restore();
  };
  img.src = dataUrl;
}
function drawUndo(f) {
  if (!f.undo.length) return;
  const cur = snapshotDataUrl(f);
  if (cur) f.redo.push(cur);
  restoreDataUrl(f, f.undo.pop());
  updateUndoButtons(f);
}
function drawRedo(f) {
  if (!f.redo.length) return;
  const cur = snapshotDataUrl(f);
  if (cur) { f.undo.push(cur); if (f.undo.length > DRAW_UNDO_LIMIT) f.undo.shift(); }
  restoreDataUrl(f, f.redo.pop());
  updateUndoButtons(f);
}

/* ---------- Eingabe (Pointer Events) ---------- */

// Handballen-Erkennung: es zeichnet nur der Stift. Finger-Eingaben erzeugen
// keine Striche (außer der Nutzer erlaubt es in den Einstellungen).
function isDrawInput(e) {
  if (e.pointerType === 'pen') return true;
  if (e.pointerType === 'mouse') return true;           // Test am Rechner
  return e.pointerType === 'touch' && fingerDrawingEnabled();
}

function drawPointOf(f, ev) {
  const r = f.canvas.getBoundingClientRect();
  // Die Strichstärke kommt AUSSCHLIESSLICH aus der Werkzeugleiste (drei Stufen).
  // Der Stiftdruck wird bewusst ignoriert: Er machte den Strich beim leichten
  // Aufsetzen dünn und beim Aufdrücken dick, obwohl eine Stufe gewählt war.
  return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: f.width };
}

function wireDrawPointer(f) {
  const c = f.canvas;

  // ---------------------------------------------------------------------
  // Finger über der Zeichenfläche
  // ---------------------------------------------------------------------
  // Gescrollt wird IMMER nativ (.draw-canvas hat touch-action: pan-y). Der
  // frühere Nachbau in JavaScript ist ersatzlos entfallen — er war der Grund
  // für Schaukeln und Ruckeln; kein Nachbau erreicht das native Scrollen von
  // Safari. Hier bleibt nur die Doppeltipp-Erkennung.
  //
  // Zwei Regeln, die dafür zwingend sind:
  //   1. Alle Pointer-Zuhörer sind PASSIV. Ein nicht-passiver Zuhörer zwingt
  //      WebKit, das Scrollen über diesem Element im Haupt-Thread abzuwickeln
  //      (es muss abwarten, ob die Seite preventDefault ruft) — genau daher
  //      kam Ruckeln nur über der Zeichenfläche.
  //   2. Natives Verhalten wird ausschließlich über touch-action gesteuert,
  //      nie über preventDefault.
  //
  // Wenn der Handballen stört (er liegt beim Schreiben oft NEBEN der Fläche
  // und startet von dort eine Scroll-Geste, die den Stiftstrich abbricht),
  // schaltet der Nutzer die Zeichnen-Sperre ein: dann nimmt die ganze Seite
  // keine Touch-Geste mehr an und nur der Stift zeichnet.
  let tapStart = null;     // laufender Finger-Tipp (für den Doppeltipp)
  let lastFingerTap = 0;

  f.applyFingerMode = () => {
    // "Mit Finger zeichnen": dann muss die Geste beim Canvas bleiben.
    c.classList.toggle('finger-draw', fingerDrawingEnabled());
  };
  f.applyFingerMode();

  // ---------------------------------------------------------------------
  // Gesten-Riegel
  // ---------------------------------------------------------------------
  // Die Mitschrift vom iPad zeigt: beim schnellen "H" wird der dritte Kontakt
  // auf KEINER Ebene gemeldet — weder als pointerdown noch als rohes
  // touchstart. Er geht also unterhalb von JavaScript verloren, in den
  // Gestenerkennern von iPadOS. touch-action: none und user-scalable=no
  // greifen dort nachweislich nicht (beides ist längst gesetzt). Das einzige
  // verbliebene Mittel, WebKit "dieser Kontakt gehört mir" zu sagen, ist
  // preventDefault auf touchstart — und dafür muss der Zuhörer nicht-passiv
  // sein.
  //
  // Genau das war bisher verboten, weil ein nicht-passiver Zuhörer WebKit
  // zwingt, das Scrollen über der Fläche im Haupt-Thread abzuwickeln (davon
  // kam das Ruckeln). Dieser Widerspruch löst sich über die Zeichnen-Sperre:
  // ist sie an, wird ohnehin nicht gescrollt (die ganze Seite steht auf
  // touch-action: none) — es gibt also nichts mehr zu verlangsamen. Ist sie
  // aus, bleibt alles passiv wie bisher.
  //
  // Der Riegel sitzt NUR auf der Zeichenfläche. Auf den Knöpfen würde
  // preventDefault deren Klick verschlucken.
  const gestenRiegel = (e) => { e.preventDefault(); };
  f.applyGestenRiegel = () => {
    c.removeEventListener('touchstart', gestenRiegel);
    if (drawLockMode()) c.addEventListener('touchstart', gestenRiegel, { passive: false });
  };
  f.applyGestenRiegel();
  f.stopPan = () => { tapStart = null; };

  // Doppeltipp mit dem Finger dreht die Karte um — auch mitten auf der
  // Zeichenfläche, und in beide Richtungen (Lösung zeigen / zurück zur Frage).
  // Der Stift ist davon ausgenommen, sonst würden zwei schnelle Punkte die
  // Karte umdrehen.
  function handleFingerTap() {
    const now = Date.now();
    if (now - lastFingerTap < 350) {
      lastFingerTap = 0;
      toggleCardFace();
    } else {
      lastFingerTap = now;
    }
  }

  c.addEventListener('pointerdown', (e) => {
    if (!isDrawInput(e)) {
      if (e.pointerType !== 'touch') return;
      diagStats.touchDown++;
      diagNote('DOWN  Finger #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) +
        (drawLockMode() ? '  (Sperre an, wird ignoriert)' : ''));
      // Mit Zeichnen-Sperre wird der Finger komplett ignoriert — auch der
      // Doppeltipp, sonst dreht der aufliegende Handballen die Karte um.
      if (drawLockMode() || f.drawing) { tapStart = null; return; }
      tapStart = { id: e.pointerId, y: e.screenY, x: e.screenX, t: Date.now() };
      return;                         // Handballen/Finger: keine Striche
    }
    diagStats.penDown++;
    diagNote('DOWN  ' + e.pointerType + ' #' + e.pointerId + ' ts=' + Math.round(e.timeStamp)
      + '  Tinte ' + diagInk(f)
      + (f.drawing ? '  (voriger Strich lief noch)' : ''));
    tapStart = null;
    if (!f.ctx) fitDrawCanvas(f);
    if (!f.ctx) { diagNote('        -> kein Zeichenkontext!'); return; }
    // Setzt der Stift erneut auf, obwohl der vorige Strich noch als laufend
    // gilt, dann ist dessen pointerup unterwegs verlorengegangen oder kommt
    // gleich verspätet. Den alten Strich hier sauber abschließen, sonst
    // schlägt er später in den neuen hinein.
    if (f.drawing) finish();
    // Kein preventDefault: der Zuhörer ist passiv, damit WebKit das Scrollen
    // über der Fläche nicht im Haupt-Thread abwickeln muss. Das native
    // Verhalten hält stattdessen touch-action auf.
    //
    // setPointerCapture NUR für die Maus: Stift und Finger sind laut Standard
    // ohnehin implizit an das Element gebunden, auf dem sie aufgesetzt haben.
    // Die zusätzliche Fixierung bringt dort nichts und ist unter WebKit ein
    // bekannter Störfaktor, wenn dieselbe pointerId schnell wiederverwendet
    // wird — genau das tut der Apple Pencil bei jedem Strich.
    if (e.pointerType === 'mouse') {
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
    }
    f.activeId = e.pointerId;
    f.moveCount = 0;
    f.rejectedMoves = 0;
    // Anfangszeit des Strichs — daran werden verspätete Ereignisse des
    // VORIGEN Strichs erkannt (siehe istVeraltet).
    f.strokeStart = (typeof e.timeStamp === 'number') ? e.timeStamp : performance.now();
    f.drawing = true;
    f.recognized = null;
    // Zustand vor dem Strich sichern — Grundlage für Begradigen und Rückgängig
    f.base = document.createElement('canvas');
    f.base.width = f.canvas.width; f.base.height = f.canvas.height;
    f.base.getContext('2d').drawImage(f.canvas, 0, 0);
    const p = drawPointOf(f, e);
    f.points = [p];
    f.holdAnchor = p;
    f.holdAnchorIndex = 0;
    f.shapeDrag = false;
    armHoldTimer(f);
  }, { passive: true });

  c.addEventListener('pointermove', (e) => {
    // Finger/Handballen setzen f.activeId nie -> fallen hier von selbst raus
    if (!f.drawing || e.pointerId !== f.activeId) {
      if (e.pointerType !== 'touch') {
        f.rejectedMoves = (f.rejectedMoves || 0) + 1;
        if (f.rejectedMoves === 1) {
          diagNote('MOVE  verworfen #' + e.pointerId +
            (f.drawing ? ' (fremde Kennung, aktiv=' + f.activeId + ')' : ' (kein laufender Strich)'));
        }
      }
      return;
    }
    f.moveCount = (f.moveCount || 0) + 1;
    // getCoalescedEvents liefert die Zwischenpunkte des Pencils -> glattere Striche
    const evts = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for (const ev of evts) addDrawPoint(f, drawPointOf(f, ev));
  }, { passive: true });

  // Beim Apple Pencil tragen ALLE Striche dieselbe pointerId. Setzt man beim
  // Schreiben schnell wieder auf (drittes Bein eines "H"), kann das pointerup
  // des vorigen Strichs erst NACH dem pointerdown des neuen eintreffen —
  // dieselbe Kennung, also hielt die App es für das Ende des neuen Strichs
  // und beendete ihn sofort wieder: der dritte Strich fehlte. Zeitstempel
  // sind auch bei verdrehter Zustellung die der Entstehung, daran lässt sich
  // ein Nachzügler sicher erkennen.
  const istVeraltet = (e) =>
    !!e && typeof e.timeStamp === 'number' && f.strokeStart != null && e.timeStamp < f.strokeStart;

  const finish = (e) => {
    if (istVeraltet(e)) {
      diagNote('UP    #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) + '  -> IGNORIERT (Nachzuegler)');
      return;
    }
    if (!f.drawing || (e && e.pointerId !== f.activeId)) {
      if (e) diagNote('UP    #' + e.pointerId + '  -> ignoriert (' +
        (f.drawing ? 'fremde Kennung, aktiv=' + f.activeId : 'kein laufender Strich') + ')');
      return;
    }
    if (e) diagNote('UP    #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) +
      '  -> Strich fertig, ' + (f.moveCount || 0) + ' Bewegungen, ' + f.points.length + ' Punkte');
    clearTimeout(f.holdTimer);
    f.drawing = false;
    f.activeId = null;
    if (f.recognized) {
      // Begradigte Form endgültig übernehmen. Das muss auch dann sauber
      // aussehen, wenn der Stift noch während der Aufhell-Animation abgehoben
      // wird — sonst bliebe der helle Blitz stehen.
      clearTimeout(f.flashTimer);
      restoreBase(f);
      drawShape(f, f.recognized, { color: f.color, width: f.width });
    } else if (f.points.length === 1) {
      drawDot(f, f.points[0]);
    } else {
      drawStrokeTail(f);
    }
    queueUndoSnapshot(f, f.base);
    f.base = null;
    f.recognized = null;
    f.shapeDrag = false;
    f.points = [];
    // Ist der Strich wirklich in den Bildpunkten gelandet? Der Wert gehört zum
    // Wert beim nächsten DOWN: fällt er dazwischen, löscht ihn etwas wieder.
    if (e) diagNote('        -> Tinte danach ' + diagInk(f));
  };

  c.addEventListener('pointerup', (e) => {
    // Finger: Tipp auswerten (Doppeltipp dreht die Karte um)
    if (tapStart && e.pointerId === tapStart.id) {
      const kurz = Date.now() - tapStart.t < 400;
      const still = Math.abs(e.screenY - tapStart.y) < 12 && Math.abs(e.screenX - tapStart.x) < 12;
      tapStart = null;
      if (kurz && still) handleFingerTap();
      return;
    }
    finish(e);
  }, { passive: true });

  c.addEventListener('pointercancel', (e) => {
    if (tapStart && e && e.pointerId === tapStart.id) {
      // Safari hat aus dem Tipp eine Scroll-Geste gemacht — kein Doppeltipp.
      diagStats.touchCancel++;
      diagNote('CANCEL Finger #' + e.pointerId + ' (aus dem Tipp wurde eine Geste)');
      tapStart = null;
      return;
    }
    if (istVeraltet(e)) {
      diagNote('CANCEL #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) + '  -> IGNORIERT (Nachzuegler)');
      return;
    }
    diagNote('CANCEL ' + e.pointerType + ' #' + e.pointerId + ' ts=' + Math.round(e.timeStamp) +
      (f.drawing ? '  -> laufender Strich VERWORFEN' : '  -> kein laufender Strich'));
    clearTimeout(f.holdTimer);
    clearTimeout(f.flashTimer);
    if (!f.drawing) return;
    // Ein abgebrochener STIFT-Strich heißt fast immer: eine Touch-Geste hat
    // dazwischengefunkt — meistens der Handballen, der neben der Fläche auf
    // dem Untergrund liegt und von dort eine Scroll-Geste startet. Genau
    // dagegen gibt es die Zeichnen-Sperre, also wird sie hier von selbst
    // eingeschaltet (einmalig, mit Hinweis — abschalten geht jederzeit).
    if (e && e.pointerType === 'pen') {
      diagStats.penCancel++;
      if (!drawLockMode()) {
        setDrawLockMode(true, '✋ Zeichnen-Sperre an: dein Handballen hat den Strich abgebrochen. Zum Scrollen unten rechts wieder ausschalten.');
      }
    }
    // Abbruch: Strich verwerfen, Ausgangszustand herstellen
    f.drawing = false; f.activeId = null; f.recognized = null; f.shapeDrag = false; f.points = [];
    if (f.base) { restoreBase(f); f.base = null; }
  }, { passive: true });
}

function addDrawPoint(f, p) {
  // Nach dem Begradigen einer Geraden bleibt der Strich gerade und hängt am
  // Stift: Der Anfangspunkt steht fest, das Ende folgt dem Pencil, bis
  // abgesetzt wird. So kann man die Gerade noch auf die gewünschte Länge und
  // Richtung ziehen, statt zurück in einen krummen Strich zu fallen.
  if (f.shapeDrag && f.recognized) {
    clearTimeout(f.holdTimer);
    dragRecognizedLine(f, p);
    return;
  }
  f.points.push(p);
  drawSegment(f, f.points.length - 1);
  // Bewegt sich der Stift wieder deutlich, wird eine erkannte Form verworfen
  // und der Strich läuft normal weiter.
  if (dist2(p, f.holdAnchor) > DRAW_HOLD_MOVE_PX * DRAW_HOLD_MOVE_PX) {
    f.holdAnchor = p;
    f.holdAnchorIndex = f.points.length - 1;
    if (f.recognized) {
      f.recognized = null;
      clearTimeout(f.flashTimer);
      replayStroke(f);
    }
    armHoldTimer(f);
  }
}

// Gerade/Pfeil am Stift mitziehen (siehe addDrawPoint).
function dragRecognizedLine(f, p) {
  const s = f.recognized;
  clearTimeout(f.flashTimer);
  s.a = { x: f.shapeStart.x, y: f.shapeStart.y };
  s.b = snapEndpoint(s.a, p);
  restoreBase(f);
  drawShape(f, s, { color: f.color, width: f.width });
}

function applyStrokeStyle(f, w) {
  const ctx = f.ctx;
  if (f.eraser) {
    // Radiert nur auf der Zeichenebene — die Vorlage liegt darunter im <img>.
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = Math.max(4, f.width * 4);
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = f.color;
    ctx.fillStyle = f.color;
    ctx.lineWidth = w;
  }
}

// Glättung: quadratische Bézier-Kurven durch die Mittelpunkte aufeinander-
// folgender Rohpunkte — sonst sehen schnelle Striche eckig aus.
function drawSegment(f, i) {
  const ctx = f.ctx, pts = f.points;
  if (!ctx || i < 1) return;
  const p0 = pts[i - 1], p1 = pts[i];
  const prevMid = i >= 2 ? midPoint(pts[i - 2], p0) : p0;
  const curMid = midPoint(p0, p1);
  ctx.save();
  applyStrokeStyle(f, (p0.w + p1.w) / 2);
  ctx.beginPath();
  ctx.moveTo(prevMid.x, prevMid.y);
  ctx.quadraticCurveTo(p0.x, p0.y, curMid.x, curMid.y);
  ctx.stroke();
  ctx.restore();
}

// Letztes Stück vom Mittelpunkt bis zum echten Endpunkt
function drawStrokeTail(f) {
  const pts = f.points;
  if (pts.length < 2 || !f.ctx) return;
  const last = pts[pts.length - 1], prev = pts[pts.length - 2];
  const ctx = f.ctx;
  ctx.save();
  applyStrokeStyle(f, last.w);
  ctx.beginPath();
  ctx.moveTo(midPoint(prev, last).x, midPoint(prev, last).y);
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
  ctx.restore();
}

function drawDot(f, p) {
  const ctx = f.ctx; if (!ctx) return;
  ctx.save();
  applyStrokeStyle(f, p.w);
  ctx.beginPath();
  ctx.arc(p.x, p.y, Math.max(0.6, (f.eraser ? f.width * 4 : p.w) / 2), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function restoreBase(f) {
  if (!f.base || !f.ctx) return;
  const ctx = f.ctx;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, f.canvas.width, f.canvas.height);
  ctx.drawImage(f.base, 0, 0);
  ctx.restore();
}

function replayStroke(f) {
  restoreBase(f);
  for (let i = 1; i < f.points.length; i++) drawSegment(f, i);
}

/* ---------- Automatisches Begradigen ---------- */

function armHoldTimer(f) {
  clearTimeout(f.holdTimer);
  if (!straightenEnabled() || f.eraser) return;
  f.holdTimer = setTimeout(() => tryRecognizeShape(f), DRAW_HOLD_MS);
}

function tryRecognizeShape(f) {
  if (!f.drawing || f.recognized || f.points.length < 4) return;
  // Die Punkte AB dem Haltepunkt sind das Zittern der ruhig gehaltenen Hand und
  // gehören nicht zum Strich. Ohne dieses Abschneiden sieht das Zittern für die
  // Pfeilerkennung wie die Zickzack-Bewegung einer Pfeilspitze aus — eine
  // gerade Linie wurde dann beim Halten fälschlich zum Pfeil.
  const pts = f.points.slice(0, f.holdAnchorIndex + 1);
  if (pts.length < 4) return;
  const shape = recognizeShape(pts);
  if (!shape) return;
  f.recognized = shape;
  // Gerade und Pfeil hängen ab jetzt am Stift (siehe addDrawPoint)
  f.shapeDrag = (shape.type === 'line' || shape.type === 'arrow');
  f.shapeStart = { x: pts[0].x, y: pts[0].y };
  restoreBase(f);
  drawShape(f, shape, { color: f.color, width: f.width });
  // Kurzes haptisches Signal, falls das Gerät es kann …
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* egal */ } }
  // … auf iPadOS wirkungslos, deshalb zusätzlich kurz aufblitzen lassen.
  flashShape(f, shape);
}

function flashShape(f, shape) {
  drawShape(f, shape, { color: '#ffcf5c', width: f.width * 2.4, alpha: .85 });
  clearTimeout(f.flashTimer);
  f.flashTimer = setTimeout(() => {
    if (drawField !== f || f.recognized !== shape) return;
    restoreBase(f);
    drawShape(f, shape, { color: f.color, width: f.width });
  }, 150);
}

// Reihenfolge: Pfeil, Rechteck, Ellipse, Linie — von der engsten zur
// großzügigsten Erkennung. Die Linie muss zuletzt kommen, sonst würde sie jede
// geschlossene Form schlucken; das Rechteck steht vor der Ellipse, weil ein
// Kreis die Rechteck-Prüfung sicher nicht besteht (seine Punkte liegen in den
// Diagonalbereichen weit von jeder Kante entfernt), umgekehrt aber ein Rechteck
// einer sehr weichen Ellipsen-Prüfung durchrutschen könnte.
function recognizeShape(pts) {
  if (SHAPE_RECOGNIZERS.arrow)   { const s = recognizeArrow(pts);   if (s) return s; }
  if (SHAPE_RECOGNIZERS.rect)    { const s = recognizeRect(pts);    if (s) return s; }
  if (SHAPE_RECOGNIZERS.ellipse) { const s = recognizeEllipse(pts); if (s) return s; }
  if (SHAPE_RECOGNIZERS.line)    { const s = recognizeLine(pts);    if (s) return s; }
  return null;
}

/* Hauptfall: gerade Linie zwischen Anfangs- und Endpunkt. Liegt der Winkel
   innerhalb von 7 Grad zur Waagerechten, Senkrechten oder einer 45-Grad-
   Diagonalen, rastet er exakt darauf ein. */
function recognizeLine(pts) {
  const a = pts[0], b = pts[pts.length - 1];
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  if (len < 18) return null;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const step = Math.PI / 4;
  const snapped = Math.round(ang / step) * step;
  const diffDeg = Math.abs(angleDiff(ang, snapped)) * 180 / Math.PI;
  const end = diffDeg <= DRAW_SNAP_DEG
    ? { x: a.x + Math.cos(snapped) * len, y: a.y + Math.sin(snapped) * len }
    : { x: b.x, y: b.y };
  return { type: 'line', a: { x: a.x, y: a.y }, b: end, snapped: diffDeg <= DRAW_SNAP_DEG };
}

/* Kreis/Ellipse: Pfad annähernd geschlossen und die Abstände zum Mittelpunkt
   (auf die Bounding-Box normiert) annähernd gleich. */
function recognizeEllipse(pts) {
  const bb = boundsOf(pts);
  if (bb.w < 26 || bb.h < 26) return null;
  if (Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y)
      > 0.32 * Math.max(bb.w, bb.h)) return null;
  const cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2, rx = bb.w / 2, ry = bb.h / 2;
  let sum = 0, sum2 = 0;
  for (const p of pts) {
    const k = Math.hypot((p.x - cx) / rx, (p.y - cy) / ry);
    sum += k; sum2 += k * k;
  }
  const n = pts.length, mean = sum / n;
  const sd = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
  // Beim Kreis/der Ellipse liegt k für jeden Punkt bei 1. Ein Rechteck käme auf
  // Mittelwert ≈ 1.15 und Streuung ≈ 0.13 (die Ecken liegen bei √2) — die
  // Schranken sind bewusst so eng, dass es hier nicht durchrutscht.
  if (mean < 0.88 || mean > 1.12 || sd > 0.10) return null;
  return { type: 'ellipse', cx, cy, rx, ry };
}

/* Rechteck: geschlossener Pfad, dessen Punkte fast alle nah an einer der vier
   achsparallelen Kanten der Bounding-Box liegen — und jede Kante kommt vor. */
function recognizeRect(pts) {
  const bb = boundsOf(pts);
  const minSide = Math.min(bb.w, bb.h);
  if (minSide < 26) return null;
  if (Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y)
      > 0.32 * Math.max(bb.w, bb.h)) return null;
  const tol = Math.max(6, 0.06 * minSide);
  const edges = [0, 0, 0, 0];
  let near = 0;
  for (const p of pts) {
    const d = [
      Math.abs(p.y - bb.y),              // oben
      Math.abs(p.x - (bb.x + bb.w)),     // rechts
      Math.abs(p.y - (bb.y + bb.h)),     // unten
      Math.abs(p.x - bb.x)               // links
    ];
    let mi = 0;
    for (let i = 1; i < 4; i++) if (d[i] < d[mi]) mi = i;
    if (d[mi] <= tol) { near++; edges[mi]++; }
  }
  if (near / pts.length < 0.85) return null;
  if (edges.some(e => e / pts.length < 0.08)) return null;
  return { type: 'rect', x: bb.x, y: bb.y, w: bb.w, h: bb.h };
}

/* Pfeil: im Wesentlichen gerader Körper, am Ende eine kurze Zickzack-Bewegung
   (mindestens zwei scharfe Richtungswechsel). Bewusst streng, damit eine
   normale Linie mit zappeligem Ende nicht fälschlich zum Pfeil wird. */
function recognizeArrow(pts) {
  const rs = resamplePath(pts, 6);
  if (rs.length < 10) return null;
  const total = pathLength(rs);
  if (total < 70) return null;

  const dirs = [];
  for (let i = 1; i < rs.length; i++) dirs.push(Math.atan2(rs[i].y - rs[i - 1].y, rs[i].x - rs[i - 1].x));

  // Länge ab Punkt i bis zum Ende
  const tailLen = new Array(rs.length).fill(0);
  for (let i = rs.length - 2; i >= 0; i--) {
    tailLen[i] = tailLen[i + 1] + Math.hypot(rs[i + 1].x - rs[i].x, rs[i + 1].y - rs[i].y);
  }

  let turns = 0, firstTurn = -1;
  for (let i = 1; i < dirs.length; i++) {
    if (tailLen[i] > 0.45 * total) continue;           // nur das Ende betrachten
    if (Math.abs(angleDiff(dirs[i], dirs[i - 1])) > 70 * Math.PI / 180) {
      turns++;
      if (firstTurn === -1) firstTurn = i;
    }
  }
  if (turns < 2 || firstTurn === -1) return null;

  const tip = rs[firstTurn];
  const zigzag = tailLen[firstTurn];
  if (zigzag < 0.08 * total || zigzag > 0.45 * total) return null;

  const bodyLen = total - zigzag;
  if (bodyLen < 40) return null;
  // Körper muss gerade sein
  let maxDev = 0;
  for (let i = 0; i <= firstTurn; i++) maxDev = Math.max(maxDev, distToLine(rs[i], rs[0], tip));
  if (maxDev > Math.max(6, 0.12 * bodyLen)) return null;

  // Die Pfeilspitze muss auch räumlich deutlich aus der Linie herausragen.
  // Ohne diese Prüfung genügte schon ein leicht zappeliges Strichende, um aus
  // einer gewollten Geraden einen Pfeil zu machen.
  let tailDev = 0;
  for (let i = firstTurn; i < rs.length; i++) tailDev = Math.max(tailDev, distToLine(rs[i], rs[0], tip));
  if (tailDev < Math.max(12, 0.06 * bodyLen)) return null;

  const a = { x: rs[0].x, y: rs[0].y };
  return { type: 'arrow', a, b: snapEndpoint(a, tip) };
}

// Gleiches Einrasten wie bei der geraden Linie
function snapEndpoint(a, b) {
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const step = Math.PI / 4;
  const snapped = Math.round(ang / step) * step;
  if (Math.abs(angleDiff(ang, snapped)) * 180 / Math.PI <= DRAW_SNAP_DEG) {
    return { x: a.x + Math.cos(snapped) * len, y: a.y + Math.sin(snapped) * len };
  }
  return { x: b.x, y: b.y };
}

function drawShape(f, shape, style) {
  const ctx = f.ctx; if (!ctx) return;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = style.color;
  ctx.lineWidth = style.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (style.alpha != null) ctx.globalAlpha = style.alpha;
  ctx.beginPath();
  if (shape.type === 'line' || shape.type === 'arrow') {
    ctx.moveTo(shape.a.x, shape.a.y);
    ctx.lineTo(shape.b.x, shape.b.y);
    ctx.stroke();
    if (shape.type === 'arrow') {
      const ang = Math.atan2(shape.b.y - shape.a.y, shape.b.x - shape.a.x);
      const len = Math.hypot(shape.b.x - shape.a.x, shape.b.y - shape.a.y);
      const hl = Math.max(12, Math.min(30, len * 0.18));
      const spread = Math.PI / 7;
      ctx.beginPath();
      ctx.moveTo(shape.b.x - Math.cos(ang - spread) * hl, shape.b.y - Math.sin(ang - spread) * hl);
      ctx.lineTo(shape.b.x, shape.b.y);
      ctx.lineTo(shape.b.x - Math.cos(ang + spread) * hl, shape.b.y - Math.sin(ang + spread) * hl);
      ctx.stroke();
    }
  } else if (shape.type === 'ellipse') {
    ctx.ellipse(shape.cx, shape.cy, shape.rx, shape.ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  } else if (shape.type === 'rect') {
    ctx.rect(shape.x, shape.y, shape.w, shape.h);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- kleine Geometrie-Helfer ---------- */

function midPoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }
function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
function boundsOf(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
    if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function pathLength(pts) {
  let l = 0;
  for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return l;
}
function distToLine(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len < 1e-6) return Math.hypot(p.x - a.x, p.y - a.y);
  return Math.abs((p.x - a.x) * dy - (p.y - a.y) * dx) / len;
}
// Gleichmäßig verteilte Punkte — macht die Richtungsauswertung beim Pfeil
// unabhängig von der Zeichengeschwindigkeit.
function resamplePath(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = out[out.length - 1];
    let b = pts[i];
    let d = Math.hypot(b.x - a.x, b.y - a.y);
    while (acc + d >= step) {
      const t = (step - acc) / d;
      const np = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      out.push(np);
      a = np;
      d = Math.hypot(b.x - a.x, b.y - a.y);
      acc = 0;
    }
    acc += d;
  }
  const last = pts[pts.length - 1];
  const tail = out[out.length - 1];
  if (Math.hypot(last.x - tail.x, last.y - tail.y) > 0.5) out.push({ x: last.x, y: last.y });
  return out;
}

/* ---------- Skizze behalten / letzte Skizze einblenden ---------- */

// Standardverhalten bleibt: beim Weiterblättern ist die Zeichnung weg. Nur auf
// ausdrücklichen Knopfdruck wandert sie als PNG in die Datenbank — höchstens
// eine pro Karte (die jeweils neueste).
async function keepSketch(f) {
  if (!f.card || f.card.id == null) { showToast('Diese Karte kann keine Skizze speichern'); return; }
  const dataUrl = downscaleCanvas(f.canvas, 900);
  if (!dataUrl) { showToast('Skizze konnte nicht gespeichert werden'); return; }
  try {
    await Store.saveSketch(f.card.id, dataUrl);
    f.storedSketch = dataUrl;
    const btn = document.getElementById('draw-prev-toggle');
    if (btn) btn.style.display = '';
    showToast('Skizze gespeichert — beim nächsten Mal einblendbar');
  } catch (e) {
    showToast('Skizze konnte nicht gespeichert werden');
  }
}

function downscaleCanvas(canvas, maxW) {
  try {
    if (canvas.width <= maxW) return canvas.toDataURL('image/png');
    const scale = maxW / canvas.width;
    const c = document.createElement('canvas');
    c.width = Math.round(canvas.width * scale);
    c.height = Math.round(canvas.height * scale);
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}

async function loadStoredSketch(f) {
  if (!f.card || f.card.id == null) return;
  let rec = null;
  try { rec = await Store.getSketch(f.card.id); } catch (e) { rec = null; }
  if (!rec || drawField !== f) return;
  f.storedSketch = rec.dataUrl;
  const btn = document.getElementById('draw-prev-toggle');
  if (btn) btn.style.display = '';
}

function togglePrevSketch(f) {
  const img = document.getElementById('draw-prev');
  const btn = document.getElementById('draw-prev-toggle');
  if (!img || !f.storedSketch) return;
  const visible = img.style.display === 'block';
  if (visible) {
    img.style.display = 'none';
    btn.textContent = '👁 letzte Skizze einblenden';
  } else {
    img.src = f.storedSketch;
    img.style.display = 'block';
    btn.textContent = '🚫 letzte Skizze ausblenden';
  }
}

/* ---------- Lösungsvergleich ---------- */

function toggleSolutionOverlay(f) {
  const layer = f.solutionSrc
    ? document.getElementById('draw-solution')
    : document.getElementById('draw-solution-dom');
  const btn = document.getElementById('draw-overlay-toggle');
  if (!layer || !f.hasSolution) return;
  f.overlayOn = !f.overlayOn;
  layer.style.display = f.overlayOn ? 'block' : 'none';
  if (f.overlayOn) fitDrawDomLayers(f);
  if (btn) btn.textContent = f.overlayOn ? '🚫 Überblendung aus' : '🔍 Überblenden';
}

// Wird beim Umdrehen der Karte aufgerufen: das Zeichenfeld bleibt sichtbar,
// wenn die Rückseite gezeigt wird — dann liegt die eigene Skizze direkt über
// bzw. neben der Lösung und lässt sich unmittelbar vergleichen.
function updateDrawForFace(revealed) {
  const block = document.getElementById('draw-block');
  if (!block) return;
  const anchor = document.getElementById('draw-anchor');
  const persist = document.getElementById('draw-persist');
  if (revealed && persist) persist.appendChild(block);
  else if (!revealed && anchor) anchor.appendChild(block);

  const solve = document.getElementById('draw-solve');
  if (solve) solve.textContent = revealed ? 'Frage zeigen' : 'Lösung zeigen';

  const row = document.getElementById('draw-overlay-row');
  const f = drawField;
  if (row) row.style.display = (revealed && f && f.hasSolution) ? 'flex' : 'none';
  if (!revealed && f && f.overlayOn) toggleSolutionOverlay(f);
  // Das Feld wechselt die Spalte — Vorlage und Lösung neu einpassen.
  if (f) requestAnimationFrame(() => { if (drawField === f) f.onResize(); });
}

const app = document.getElementById('app');
let currentSession = null; // aktive Lern-Sitzung

async function renderHome() {

      const cards = await Store.getCardsForDeck(deck.id);
      const dueCount = cards.filter(c => c.due <= today).length;
      const favCount = cards.filter(c => c.favorite).length;
      const stats = computeDeckStats(cards, deck);
      deckItemsHtml += `
        <div class="deck-card">

            <div class="deck-info">
              <div class="deck-name">${escapeHtml(deck.name)}</div>

                <div class="deck-stats-text">${stats.progressPct}% gelernt · ${stats.mature} reif${stats.daysLeft > 0 ? ` · noch ca. ${stats.daysLeft} Tag${stats.daysLeft === 1 ? '' : 'e'} bis alle neuen Karten dran waren` : ''}</div>
              </div>
            </div>

            <button class="primary" data-action="study" data-id="${deck.id}" ${cards.length === 0 ? 'disabled' : ''}>Lernen starten</button>
            <button class="secondary" data-action="browse" data-id="${deck.id}" ${cards.length === 0 ? 'disabled' : ''}>Durchsehen</button>
            <button class="secondary" data-action="study-fav" data-id="${deck.id}" ${favCount === 0 ? 'disabled' : ''}>⭐ Favoriten (${favCount})</button>
            <button class="secondary" data-action="export" data-id="${deck.id}" ${cards.length === 0 ? 'disabled' : ''} title="Stapel mit Lernfortschritt exportieren (zum Teilen aufs andere Gerät)">⬆️ Export</button>
            <button class="delete-btn" data-action="delete" data-id="${deck.id}">Löschen</button>
          </div>
        </div>`;
    }
  }

  app.innerHTML = `
    <header class="topbar">
      <h1><span class="logo-dot"></span>Karteikarten</h1>
      <button class="icon-btn" id="open-settings" title="Einstellungen">⚙️</button>
    </header>
    <main>
      <div class="import-zone" id="dropzone">
        <div class="import-icon">📁</div>
        <div>.apkg- oder Export-Datei hierher ziehen</div>
        <button class="primary" id="import-btn">Datei auswählen</button>
        <input type="file" id="file-input">
      </div>
      <div class="deck-list">${deckItemsHtml}</div>
    </main>
  `;

  document.getElementById('open-settings').addEventListener('click', openSettings);

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  // iOS/iPadOS: KEIN accept setzen. Safari übersetzt accept in UTIs — ".apkg" kennt es
  // nicht und verwirft es, "application/json" wird zu "public.json". Ergebnis: der
  // Dateien-Picker zeigt nur noch JSON, .apkg ist ausgegraut. Ohne accept ist alles
  // wählbar; die Prüfung passiert ohnehin in handleImport().
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (!isIOS) fileInput.accept = '.apkg,.json,application/json';
  document.getElementById('import-btn').addEventListener('click', () => fileInput.click());

    if (e.target.files.length) handleImport(e.target.files[0]);

  app.querySelectorAll('[data-action="study"]').forEach(btn => {

  app.querySelectorAll('[data-action="browse"]').forEach(btn => {

  app.querySelectorAll('[data-action="study-fav"]').forEach(btn => {

  app.querySelectorAll('[data-action="delete"]').forEach(btn => {

  });
  app.querySelectorAll('[data-action="export"]').forEach(btn => {
    btn.addEventListener('click', () => exportDeck(parseInt(btn.dataset.id, 10)));
  });
}

    actions: [

  closeModal();
  modalRoot = document.createElement('div');

  modalRoot.innerHTML = `
    <div class="modal-box">
